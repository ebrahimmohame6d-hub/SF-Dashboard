<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SF Dashboard v8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#eef1f8;
    --surface:#ffffff;
    --line:#dde3ee;
    --ink:#151b2e;
    --muted:#68728b;
    --accent:#2b4b8f;
    --accent2:#7c3aed;
    --accent-ink:#1c2f66;
    --glow:rgba(43,75,143,.24);
    --bad:#dc2626;
    --bad-bg:#fde7e6;
    --good:#0f9d58;
    --good-bg:#e2f6ea;
    --warn:#d97706;
    --warn-bg:#fef3d9;
    --radius:8px;
    /* Name/user fonts: clear and slightly larger */
    --font-latin:"Inter","Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overflow-x:hidden}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:14.5px;line-height:1.6;font-variant-numeric:tabular-nums;
  }
  .wrap{max-width:1360px;margin:0 auto;padding:22px 18px 64px}

  header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;
    justify-content:space-between;padding:18px 22px;margin-bottom:16px;
    background:linear-gradient(120deg,#111a44 0%,var(--accent) 55%,var(--accent2) 130%);
    border-radius:var(--radius);color:#fff;box-shadow:0 10px 26px rgba(17,26,68,.32)}
  h1{font-size:23px;font-weight:900;margin:0;letter-spacing:-.3px}
  h1 small:empty{display:none}
  h1 small{display:block;font-size:12.5px;font-weight:500;color:#d9e1fb;margin-top:4px}
  .head-actions{display:flex;gap:8px;align-items:center}

  button{font-family:inherit;font-size:13.5px;font-weight:700;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    padding:9px 18px;border-radius:var(--radius);cursor:pointer;
    transition:box-shadow .15s ease,transform .15s ease,border-color .15s ease}
  button:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow),0 6px 16px rgba(43,75,143,.2);transform:translateY(-1px)}
  button:focus-visible{outline:2px solid #fff;outline-offset:2px}
  button.primary{background:#ffffff;border-color:#ffffff;color:var(--accent-ink)}
  button.primary:hover{box-shadow:0 0 0 3px rgba(255,255,255,.45),0 6px 16px rgba(0,0,0,.15)}
  button.ghost{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4);color:#fff}
  button.ghost:hover{box-shadow:0 0 0 3px rgba(255,255,255,.28)}
  button[disabled]{opacity:.5;cursor:default;transform:none;box-shadow:none}

  .stats{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}
  .stat{flex:1 1 150px;padding:16px 18px;background:var(--surface);
    border:1px solid var(--line);border-top:4px solid var(--c,var(--accent));
    border-radius:var(--radius);transition:box-shadow .15s ease,transform .15s ease}
  .stat:hover{box-shadow:0 0 0 3px var(--glow),0 10px 22px rgba(43,75,143,.16);transform:translateY(-2px)}
  .stat b{display:block;font-size:28px;font-weight:900;line-height:1.2;color:var(--c,var(--accent))}
  .stat span{font-size:12px;color:var(--muted);font-weight:500}
  .stats-cap{flex:0 0 100%;display:inline-flex;align-self:flex-start;align-items:center;gap:8px;
    padding:8px 16px;background:#eef1fb;border:1px solid #cfd8ee;border-inline-start:4px solid var(--accent);
    border-radius:9px;font-size:13px;font-weight:700;color:var(--accent-ink)}

  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;
    padding:14px 16px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);margin-bottom:12px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:12px;color:var(--muted);font-weight:500}
  input{font-family:inherit;font-size:13.5px;color:var(--ink);
    border:1px solid var(--line);background:var(--surface);
    padding:8px 10px;border-radius:var(--radius);min-width:165px;font-weight:500;
    transition:box-shadow .15s ease,border-color .15s ease}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
  .check{display:flex;align-items:center;gap:6px;font-size:13.5px;padding-bottom:8px;cursor:pointer;font-weight:500}
  .check input{min-width:auto;width:16px;height:16px;accent-color:var(--bad)}

  .tabs{display:flex;gap:6px;margin-bottom:0}
  .tab{border:1px solid var(--line);background:var(--surface);
    padding:11px 22px;font-size:13.5px;font-weight:700;cursor:pointer;
    border-radius:var(--radius) var(--radius) 0 0;color:var(--muted);
    border-bottom:none;position:relative;top:1px;
    transition:box-shadow .15s ease,color .15s ease}
  .tab:hover{color:var(--accent-ink)}
  .tab[aria-selected="true"]{background:var(--surface);color:var(--accent-ink);
    border-color:var(--accent);box-shadow:0 -3px 0 0 var(--accent) inset}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:0 var(--radius) var(--radius) var(--radius);overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:10px 14px;text-align:left;border-bottom:1px solid #eef1f7;white-space:nowrap}
  thead th{position:sticky;top:0;background:#f3f5fb;font-weight:800;font-size:12px;
    color:var(--accent-ink);cursor:pointer;user-select:none;border-bottom:2px solid var(--line);z-index:2;
    transition:color .15s ease,background .15s ease}
  thead th:hover{color:var(--accent);background:#eaeefb}
  tbody tr{transition:box-shadow .12s ease,background .12s ease}
  /* Hover only on data rows — team header bar (group-head) and day-details row (detail) are excluded so their color stays fixed */
  tbody tr:not(.group-head):not(.detail):hover td:not(.sd-team-cell):not(.s-name-cell){background:#eef3ff !important;box-shadow:inset 0 1px 0 var(--accent),inset 0 -1px 0 var(--accent)}
  td.num{text-align:center}
  td.hours{font-weight:800;text-align:center}
  .team-pill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700;color:#fff}
  /* Recorded days (green) and missing days (red): rounded pill-like box */
  .cnt{display:inline-block;min-width:52px;padding:6px 18px;border-radius:16px;
    font-weight:800;font-size:14.5px;line-height:1.3;text-align:center;border:1px solid transparent}
  .cnt.ok{background:var(--good-bg);color:var(--good);border-color:#bfe6cf}
  .cnt.bad{background:var(--bad-bg);color:var(--bad);border-color:#f5b8b3}
  .toggle,.sd-toggle{border:none;background:none;color:var(--accent);padding:3px 8px;font-size:12.5px;font-weight:700;
    cursor:pointer;text-decoration:underline;border-radius:4px;transition:box-shadow .12s ease}
  .toggle:hover,.sd-toggle:hover{box-shadow:0 0 0 3px var(--glow)}
  tr.detail td{background:#f9fafd;padding:14px 16px;white-space:normal}

  /* Scroll hint shown above wide tables — hidden on desktop, shown only on narrow screens (see media query) */
  .scroll-hint{display:none}

  /* ===== Month selector (26th → 25th period) ===== */
  .gh-flex{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .mbox{display:inline-flex;align-items:center;gap:10px}
  .mrange{font-size:12px;font-weight:500;opacity:.9;direction:ltr}
  .month-sel,.m-sel{height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--line);
    background:#fff;color:var(--accent-ink);font-family:inherit;font-size:13px;font-weight:800;
    cursor:pointer;min-width:0}
  .month-sel:focus,.m-sel:focus{outline:none;box-shadow:0 0 0 3px var(--glow)}
  .group-head .month-sel{border:0}
  .month-bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:12px 16px;
    background:#f3f5fb;border-bottom:1px solid var(--line)}
  .month-bar b{font-size:13px;font-weight:800;color:var(--accent-ink)}
  .month-bar .mrange{color:var(--muted)}
  /* Week separator in the QC tab: solid black bar showing "Week N — from X to Y" */
  .week-bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:11px 18px;margin-top:18px;
    background:#000;color:#fff;border-radius:8px}
  .week-bar b{font-size:14px;font-weight:900;color:#fff}
  .week-bar .mrange{color:#fff;font-weight:600;font-size:13px;opacity:.95}
  .teamcard{margin-top:0}

  /* ===== Team Hours tab: one row per member, one column per day, Total at the end ===== */
  .th-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 16px 16px}
  table.hours-table{border-collapse:separate;border-spacing:0;font-size:13.5px;width:auto;min-width:100%;
    border:1px solid #cfd8ea;border-radius:8px;overflow:hidden}
  .hours-table th,.hours-table td{padding:10px 14px;text-align:center;white-space:nowrap;
    border-bottom:1px solid #d8dfec;border-inline-start:1px solid #e3e8f2}
  .hours-table thead th,
  .hours-table thead th:hover{position:static;background:#1c3f6e;color:#fff;cursor:default;
    font-weight:800;font-size:13px;border-bottom:none}
  .hours-table tbody tr:nth-child(even) td{background:#f5f7fc}
  .hours-table .col-name{min-width:210px;text-align:left}
  .hours-table .col-user{text-align:left}
  .hours-table th.col-name,.hours-table td.col-name{position:sticky;left:0;z-index:1;background:#fff}
  .hours-table thead th.col-name{background:#1c3f6e;z-index:3}
  .hours-table tbody tr:nth-child(even) td.col-name{background:#f5f7fc}
  .hours-table td.hv{font-weight:600}
  .hours-table td.hv.bad{color:var(--bad);font-weight:800}
  .hours-table td.hv.none{color:var(--muted)}
  .hours-table td.htotal,.hours-table th.htotal{background:#dfe6f7 !important;color:var(--accent-ink);font-weight:900}
  .hours-table thead th.htotal{background:#28508a !important;color:#fff}
  .hours-table tfoot td{background:#1c3f6e;color:#fff;font-weight:900;border-bottom:none}
  .hours-table tfoot td.col-name{background:#1c3f6e;z-index:1}

  /* ===== Missing days (user details): date in a box + hours in a circle, card lifts on hover ===== */
  .days-wrap{width:100%}
  .days-title{font-weight:800;font-size:13.5px;color:var(--accent-ink);margin-bottom:12px}
  .days-title span{color:var(--muted);font-weight:600;margin-inline-start:4px}
  .days-title.good{color:var(--good)}
  .days-title.bad{color:var(--bad)}
  .days-grid + .days-title{margin-top:18px}
  .days-none{color:var(--muted);font-weight:600;font-size:13px}
  .days-grid{display:flex;flex-wrap:wrap;gap:10px}
  .day-card{flex:0 0 auto;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:8px 12px;background:#ffffff;border:1px solid var(--line);border-radius:14px;
    cursor:default;transition:transform .15s ease,box-shadow .15s ease}
  .day-card:hover{transform:translateY(-4px) scale(1.04);
    box-shadow:0 0 0 3px var(--glow),0 14px 26px rgba(21,27,46,.2)}
  .day-date{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-width:92px;padding:5px 10px;background:#eef1fb;border:1px solid #cfd8ee;border-radius:9px;direction:ltr}
  .day-date b{font-family:var(--font-latin);font-weight:700;font-size:13px;color:#0f172a;letter-spacing:.2px;line-height:1.3}
  .day-date small{font-family:"Tajawal",sans-serif;font-size:11px;color:var(--muted);font-weight:700;line-height:1.3;direction:ltr}
  .day-hours{display:inline-flex;align-items:center;justify-content:center;flex:0 0 44px;
    width:44px;height:44px;border-radius:50%;background:var(--bad-bg);color:var(--bad);
    border:2px solid #f5b8b3;font-weight:900;font-size:12.5px}
  .day-card .att{min-width:32px;padding:2px 8px;font-size:12px}
  .day-hours.ok{background:var(--good-bg);color:var(--good);border-color:#a8dfc0}

  .name{font-family:var(--font-latin);font-weight:600;font-size:14px;color:#0f172a}
  .name.empty{font-family:"Tajawal",sans-serif;color:var(--muted);font-weight:500}

  /* Team color is a fixed solid color — no gradient, and it doesn't change on hover */
  .group-head,
  .group-head:hover{background:var(--c,var(--accent));color:#fff}
  .group-head td,
  .group-head:hover td{padding:12px 16px;font-size:14.5px;font-weight:800;border-bottom:none;white-space:normal;
    background:var(--c,var(--accent)) !important;color:#fff !important;box-shadow:none !important}
  .group-head .gsub{font-weight:500;font-size:12px;opacity:.9;margin-inline-start:10px}

  .note{padding:44px 20px;text-align:center;color:var(--muted)}
  .note.error{color:var(--bad)}
  .note a{color:var(--accent)}
  .note code{background:#eef2f5;padding:2px 6px;border-radius:3px;direction:ltr;display:inline-block}
  .note button{margin-top:4px}
  .foot{margin-top:10px;font-size:12px;color:var(--muted);display:flex;
    justify-content:space-between;flex-wrap:wrap;gap:8px}

  .teamcard{display:flex;flex-wrap:wrap;gap:18px;padding:22px;justify-content:center}
  /* Team card: a plain square (not a circle) with one fixed color for every card */
  .tcard{width:190px;min-height:170px;flex:0 0 auto;background:var(--surface);
    border:1px solid var(--line);border-top:6px solid var(--c,var(--accent));border-radius:var(--radius);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:16px 14px;transition:box-shadow .15s ease,transform .15s ease}
  .tcard:hover{box-shadow:0 0 0 3px var(--glow),0 10px 22px rgba(43,75,143,.16);transform:translateY(-2px)}
  .tcard h3{margin:0 0 6px;font-size:14px;font-weight:800;color:var(--c,var(--accent-ink));line-height:1.2}
  .tcard .big{font-size:26px;font-weight:900;color:var(--ink);line-height:1.1}
  .tcard .big small{display:block;font-size:10.5px;color:var(--muted);font-weight:500;margin-top:2px}
  .tcard .row2{display:flex;gap:12px;margin-top:10px}
  .tcard .row2 span{font-size:10.5px;color:var(--muted);font-weight:500;text-align:center}
  .tcard .row2 b{display:block;color:var(--ink);font-weight:900;font-size:14px;margin-top:2px}
  .tcard .row2 b.good{color:var(--good)}
  .tcard .row2 b.bad{color:var(--bad)}

  /* Details modal: weekly blocks (black week bar, day cards, weekly average box + deduction) */
  .wk-bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:8px 14px;margin:16px 0 10px;
    background:#000;color:#fff;border-radius:8px;font-family:var(--font-latin);font-size:12.5px}
  .wk-bar:first-child{margin-top:4px}
  .wk-bar b{font-weight:800;color:#fff}
  .wk-bar span{font-weight:600;color:#fff;opacity:.95}
  .wk-sum{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:12px}
  .wk-lbl{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#475569}
  .wk-avg{min-width:74px;padding:8px 14px;border-radius:9px;font-weight:900;font-size:15px;line-height:1.2;
    text-align:center;color:#fff}
  .wk-avg.good{background:var(--good)}
  .wk-avg.warn{background:#eab308;color:#3b2f00}
  .wk-avg.bad{background:var(--bad)}
  .wk-pct{font-size:12.5px;font-weight:700;color:#475569}
  .wk-ded{font-size:13px;font-weight:900;direction:ltr}
  .wk-ded.warn{color:#a16207}
  .wk-ded.bad{color:var(--bad)}

  /* ===== Submit ===== */
  .submit-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;
    padding:14px 16px;border-bottom:1px solid var(--line);background:#f9fafd}
  .submit-toolbar .field label{font-size:12px;color:var(--muted);font-weight:500}
  .submit-hint{font-size:12px;color:var(--muted);align-self:center;max-width:340px}
  .submit-link{align-self:center;color:var(--accent);font-weight:700;font-size:13.5px;text-decoration:underline}
  .submit-link:hover{color:var(--accent-ink)}
  .submit-body{padding:24px 16px;display:flex;justify-content:center;overflow-x:auto;-webkit-overflow-scrolling:touch}

  /* Submit table: team names on the left, FP / QA / Total on the right */
  .submit-table{width:100%;max-width:640px;direction:ltr;
    border-collapse:separate;border-spacing:0;
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .submit-table th,.submit-table td{text-align:center;padding:10px 12px;
    border-bottom:1px solid var(--line);white-space:nowrap}
  .submit-table th+th,.submit-table td+td{border-inline-start:1px solid var(--line)}
  .submit-table thead th,
  .submit-table thead th:hover{position:static;cursor:default;background:#343b4a;color:#fff;
    font-size:14px;font-weight:800;padding:12px;border-bottom:none}
  .submit-table .s-name-cell{color:#fff;font-weight:800;font-size:14px;min-width:170px}
  .submit-table td.s-val{font-weight:800;font-size:15px}
  .submit-table td.s-total{font-weight:900;font-size:15px;background:#f3f5fb;color:var(--accent-ink)}
  .submit-table input.submit-input{width:100%;max-width:120px;min-width:0;text-align:center;
    font-weight:800;font-size:15px;padding:7px 6px}
  .submit-table tbody tr:last-child td{border-bottom:none}
  .submit-table tfoot td{background:#1c2f66;color:#fff;font-weight:900;font-size:15px;border-bottom:none}
  input[type=number].submit-input::-webkit-outer-spin-button,
  input[type=number].submit-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input[type=number].submit-input{-moz-appearance:textfield}
  .submit-savebar{display:flex;justify-content:center;align-items:center;gap:12px;
    padding:16px;border-top:1px solid var(--line)}
  .submit-savebar button.primary{background:var(--accent-ink);border-color:var(--accent-ink);color:#fff}
  .submit-saved-note{font-size:12px;color:var(--good);font-weight:700}
  .submit-saved-note.warn{color:var(--bad)}

  /* ===== Single Day ===== */
  .single-day-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.single-day-table{width:100%;border-collapse:collapse;font-size:14px}
  .single-day-table thead th{position:sticky;top:0;background:#1c2f66;color:#fff;
    font-size:12px;font-weight:800;padding:9px 12px;text-align:center;z-index:2;cursor:default}
  .single-day-table thead th:hover{background:#1c2f66;color:#fff}
  .single-day-table td{padding:8px 12px;border-bottom:1px solid #eef1f7;text-align:center;vertical-align:middle}
  .single-day-table td.sd-empty{color:var(--muted);font-weight:600;padding:16px}

  .single-day-table tbody tr:not(.sd-detail):hover td:not(.sd-team-cell){background:#f4f7ff}
  .single-day-table tr.detail td{text-align:left}
  .sd-info{display:inline-flex;align-items:center;gap:8px;margin:0 16px 12px;padding:9px 16px;
    background:#eef1fb;border:1px solid #cfd8ee;border-inline-start:4px solid var(--accent);
    border-radius:9px;font-weight:700;font-size:13px;color:var(--accent-ink)}
  /* Team cell: one fixed solid color */
  .sd-team-cell,
  .sd-team-cell:hover,
  .sd-team-cell:focus,
  tr:hover .sd-team-cell{
    text-align:center;vertical-align:middle;
    border-bottom:3px solid rgba(255,255,255,.35);min-width:130px;padding:10px 8px;
    background-image:none !important;background-color:var(--team-c1) !important
  }
  .sd-team-box{display:inline-block;padding:9px 16px;border-radius:9px;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);
    color:#fff;font-weight:900;font-size:14px;line-height:1.4}
  .sd-team-cell .tsub{display:block;font-size:10.5px;font-weight:600;opacity:.92;margin-top:3px}

  /* Name and user: clear box + larger, clearer font */
  .sd-box{display:inline-block;padding:6px 13px;border-radius:8px;background:#f1f4fb;border:1px solid #e0e6f3;direction:ltr}
  .sd-name{font-family:var(--font-latin);font-weight:600;font-size:14.5px;color:#0f172a;letter-spacing:.1px}
  .sd-name.empty{font-family:"Tajawal",sans-serif;color:var(--muted);font-weight:600;direction:ltr}
  /* User: the user code is bold and clear, the domain (@meti.ai) is quieter */
  .uid{display:inline-block;direction:ltr;padding:6px 13px;border-radius:9px;
    background:#f1f4fb;border:1px solid #e0e6f3;font-family:"Inter",system-ui,sans-serif;font-size:14px;
    line-height:1.4;white-space:nowrap}
  .uid .uid-id{font-weight:700;color:#0f172a;letter-spacing:.6px;text-transform:uppercase}
  .uid .uid-dom{font-weight:500;font-size:13px;color:#64748b;letter-spacing:.1px}

  .sd-hours{display:inline-flex;align-items:center;justify-content:center;
    width:46px;height:46px;border-radius:50%;

  /* Attendance: P / PT */

  /* Image capture banner (shown only while preparing the below-target image) */

    border-bottom:1px solid #f5b8b3}

  /* ===== Details modal ===== */
  .modal-back{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;
    justify-content:center;padding:24px;z-index:50}
  .modal-back[hidden]{display:none}
  .modal-card{background:#fff;border-radius:20px;width:min(900px,100%);max-height:calc(100vh - 48px);

  .modal-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}

  .m-label-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  /* "Below target" small box inside the details modal */
  .m-check{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;background:#fff;
    border:1px solid #cfd8ee;border-radius:8px;cursor:pointer;user-select:none;
    text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:700;color:var(--ink)}
  .m-check input{min-width:auto;width:16px;height:16px;padding:0;accent-color:var(--bad);cursor:pointer}
  .m-value{font-family:var(--font-latin);font-size:16px;font-weight:700;color:#0f172a;word-break:break-word}
  .m-value.blue{color:#1c3f8f}
  .m-value.good{color:var(--good)}

  .m-value .day-card{background:#fff}
  .m-value .day-card.noatt{background:#d3d7de;border-color:#b9bfc9}
  .att-dash{background:transparent;color:#5b6472;border-color:transparent;font-weight:800}
  .m-value .day-date small{font-family:var(--font-latin);direction:ltr}
  .m-monthbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px;

  .m-monthbar b{font-size:13px;font-weight:800;color:var(--accent-ink)}
  .m-monthbar .mrange{color:var(--muted)}
  @media (max-width:640px){
    .modal-back{padding:10px}
    .modal-card{padding:16px 14px 20px;border-radius:18px}
    .modal-head{margin-bottom:12px}

  @media (max-width:640px){

  /* ===== Extra mobile tightening + fix for tables overflowing the screen ===== */
  @media (max-width:640px){
    .wrap{padding:16px 10px 56px}
    header{padding:14px;gap:10px}
    .head-actions{width:100%;justify-content:flex-end;flex-wrap:wrap}

    /* Tabs scroll sideways instead of wrapping button text into two lines */
    .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:4px}
    .tab{white-space:nowrap;flex:0 0 auto;padding:10px 16px;font-size:12.5px}
    /* Tighter tables so more columns are visible before you need to scroll */
    th,td{padding:8px 10px;font-size:12.5px}
    .name,.sd-name{font-size:13px}
    .uid{padding:5px 10px;font-size:12.5px}
    .scroll-hint{display:block;font-size:11.5px;color:var(--accent-ink);font-weight:700;
      padding:6px 12px;background:#eef1fb;border-bottom:1px solid var(--line);white-space:nowrap}
    .day-card{flex:1 1 100%}

    .submit-table th,.submit-table td{padding:8px 8px;font-size:13px}

  @media (prefers-reduced-motion:reduce){
