<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SF Dashboard v6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#eef1f8;
    --surface:#ffffff;
    --line:#dde3ee;
    --ink:#151b2e;
    --muted:#68728b;
    --accent:#2b4b8f;
    --accent2:#7c3aed;
    --accent-ink:#1c2f66;
    --glow:rgba(43,75,143,.24);
    --bad:#dc2626;
    --bad-bg:#fde7e6;
    --good:#0f9d58;
    --good-bg:#e2f6ea;
    --warn:#d97706;
    --warn-bg:#fef3d9;
    --radius:8px;
    /* خطوط الأسماء واليوزرات: واضحة وكبيرة شوية */
    --font-latin:"Inter","Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:14.5px;line-height:1.6;font-variant-numeric:tabular-nums;
  }
  .wrap{max-width:1360px;margin:0 auto;padding:22px 18px 64px}

  header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;
    justify-content:space-between;padding:18px 22px;margin-bottom:16px;
    background:linear-gradient(120deg,#111a44 0%,var(--accent) 55%,var(--accent2) 130%);
    border-radius:var(--radius);color:#fff;box-shadow:0 10px 26px rgba(17,26,68,.32)}
  h1{font-size:23px;font-weight:900;margin:0;letter-spacing:-.3px}
  h1 small{display:block;font-size:12.5px;font-weight:500;color:#d9e1fb;margin-top:4px}
  .head-actions{display:flex;gap:8px;align-items:center}

  button{font-family:inherit;font-size:13.5px;font-weight:700;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    padding:9px 18px;border-radius:var(--radius);cursor:pointer;
    transition:box-shadow .15s ease,transform .15s ease,border-color .15s ease}
  button:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow),0 6px 16px rgba(43,75,143,.2);transform:translateY(-1px)}
  button:focus-visible{outline:2px solid #fff;outline-offset:2px}
  button.primary{background:#ffffff;border-color:#ffffff;color:var(--accent-ink)}
  button.primary:hover{box-shadow:0 0 0 3px rgba(255,255,255,.45),0 6px 16px rgba(0,0,0,.15)}
  button.ghost{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4);color:#fff}
  button.ghost:hover{box-shadow:0 0 0 3px rgba(255,255,255,.28)}
  button[disabled]{opacity:.5;cursor:default;transform:none;box-shadow:none}

  .stats{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}
  .stat{flex:1 1 150px;padding:16px 18px;background:var(--surface);
    border:1px solid var(--line);border-top:4px solid var(--c,var(--accent));
    border-radius:var(--radius);transition:box-shadow .15s ease,transform .15s ease}
  .stat:hover{box-shadow:0 0 0 3px var(--glow),0 10px 22px rgba(43,75,143,.16);transform:translateY(-2px)}
  .stat b{display:block;font-size:28px;font-weight:900;line-height:1.2;color:var(--c,var(--accent))}
  .stat span{font-size:12px;color:var(--muted);font-weight:500}

  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;
    padding:14px 16px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);margin-bottom:12px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:12px;color:var(--muted);font-weight:500}
  input{font-family:inherit;font-size:13.5px;color:var(--ink);
    border:1px solid var(--line);background:var(--surface);
    padding:8px 10px;border-radius:var(--radius);min-width:165px;font-weight:500;
    transition:box-shadow .15s ease,border-color .15s ease}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
  .check{display:flex;align-items:center;gap:6px;font-size:13.5px;padding-bottom:8px;cursor:pointer;font-weight:500}
  .check input{min-width:auto;width:16px;height:16px;accent-color:var(--bad)}

  .tabs{display:flex;gap:6px;margin-bottom:0}
  .tab{border:1px solid var(--line);background:var(--surface);
    padding:11px 22px;font-size:13.5px;font-weight:700;cursor:pointer;
    border-radius:var(--radius) var(--radius) 0 0;color:var(--muted);
    border-bottom:none;position:relative;top:1px;
    transition:box-shadow .15s ease,color .15s ease}
  .tab:hover{color:var(--accent-ink)}
  .tab[aria-selected="true"]{background:var(--surface);color:var(--accent-ink);
    border-color:var(--accent);box-shadow:0 -3px 0 0 var(--accent) inset}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:0 var(--radius) var(--radius) var(--radius);overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:10px 14px;text-align:right;border-bottom:1px solid #eef1f7;white-space:nowrap}
  thead th{position:sticky;top:0;background:#f3f5fb;font-weight:800;font-size:12px;
    color:var(--accent-ink);cursor:pointer;user-select:none;border-bottom:2px solid var(--line);z-index:2;
    transition:color .15s ease,background .15s ease}
  thead th:hover{color:var(--accent);background:#eaeefb}
  tbody tr{transition:box-shadow .12s ease,background .12s ease}
  /* الـ hover على صفوف الداتا بس — شريط الكيوسي (group-head) وصف تفاصيل الأيام (detail) مستثنيين عشان لونهم يفضل ثابت */
  tbody tr:not(.group-head):not(.detail):hover td:not(.sd-team-cell):not(.s-name-cell){background:#eef3ff !important;box-shadow:inset 0 1px 0 var(--accent),inset 0 -1px 0 var(--accent)}
  td.mono{font-family:var(--font-mono);font-size:13px;font-weight:500;direction:ltr;text-align:right;color:#1e293b}
  td.num{text-align:center}
  td.hours{font-weight:800;text-align:center}
  .team-pill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700;color:#fff}
  .miss{font-weight:800;text-align:center;background:var(--bad-bg);color:var(--bad)}
  .miss.zero{background:var(--good-bg);color:var(--good)}
  .bar{height:6px;background:#e8edf5;border-radius:3px;overflow:hidden;min-width:80px}
  .bar b{display:block;height:100%;background:var(--bad)}
  .bar.ok b{background:var(--good)}
  .toggle{border:none;background:none;color:var(--accent);padding:3px 8px;font-size:12.5px;font-weight:700;
    cursor:pointer;text-decoration:underline;border-radius:4px;transition:box-shadow .12s ease}
  .toggle:hover{box-shadow:0 0 0 3px var(--glow)}
  tr.detail td{background:#f9fafd;padding:14px 16px;white-space:normal}

  /* ===== الأيام الناقصة (تفاصيل اليوزر): تاريخ في مربع + ساعات في دايرة، والكارت يبرز عند الوقوف ===== */
  .days-wrap{width:100%}
  .days-title{font-weight:800;font-size:13.5px;color:var(--accent-ink);margin-bottom:12px}
  .days-title span{color:var(--muted);font-weight:600;margin-inline-start:4px}
  .days-grid{display:flex;flex-wrap:wrap;gap:12px}
  .day-card{flex:0 0 226px;display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:10px 14px;background:#ffffff;border:1px solid var(--line);border-radius:14px;
    cursor:default;transition:transform .15s ease,box-shadow .15s ease}
  .day-card:hover{transform:translateY(-4px) scale(1.04);
    box-shadow:0 0 0 3px var(--glow),0 14px 26px rgba(21,27,46,.2)}
  .day-date{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-width:112px;padding:7px 12px;background:#eef1fb;border:1px solid #cfd8ee;border-radius:10px;direction:ltr}
  .day-date b{font-family:var(--font-latin);font-weight:700;font-size:15px;color:#0f172a;letter-spacing:.2px;line-height:1.3}
  .day-date small{font-family:"Tajawal",sans-serif;font-size:12px;color:var(--muted);font-weight:700;line-height:1.3;direction:rtl}
  .day-hours{display:inline-flex;align-items:center;justify-content:center;flex:0 0 54px;
    width:54px;height:54px;border-radius:50%;background:var(--bad-bg);color:var(--bad);
    border:2px solid #f5b8b3;font-weight:900;font-size:14.5px}

  .name{font-family:var(--font-latin);font-weight:600;font-size:14px;color:#0f172a}
  .name.empty{font-family:"Tajawal",sans-serif;color:var(--muted);font-weight:500}

  /* لون الكيوسي ثابت (solid) — من غير تدرّج، وما بيتغيرش عند الوقوف بالماوس */
  .group-head,
  .group-head:hover{background:var(--c,var(--accent));color:#fff}
  .group-head td,
  .group-head:hover td{padding:12px 16px;font-size:14.5px;font-weight:800;border-bottom:none;white-space:normal;
    background:var(--c,var(--accent)) !important;color:#fff !important;box-shadow:none !important}
  .group-head .gsub{font-weight:500;font-size:12px;opacity:.9;margin-inline-start:10px}

  .note{padding:44px 20px;text-align:center;color:var(--muted)}
  .note.error{color:var(--bad)}
  .note a{color:var(--accent)}
  .note code{background:#eef2f5;padding:2px 6px;border-radius:3px;direction:ltr;display:inline-block}
  .note button{margin-top:4px}
  .foot{margin-top:10px;font-size:12px;color:var(--muted);display:flex;
    justify-content:space-between;flex-wrap:wrap;gap:8px}

  .teamcard{display:flex;flex-wrap:wrap;gap:18px;padding:22px;justify-content:center}
  /* بطاقة الفريق: مربع عادي (مش دايرة) بلون ثابت واحد لكل الكروت */
  .tcard{width:190px;min-height:170px;flex:0 0 auto;background:var(--surface);
    border:1px solid var(--line);border-top:6px solid var(--c,var(--accent));border-radius:var(--radius);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:16px 14px;transition:box-shadow .15s ease,transform .15s ease}
  .tcard:hover{box-shadow:0 0 0 3px var(--glow),0 10px 22px rgba(43,75,143,.16);transform:translateY(-2px)}
  .tcard h3{margin:0 0 6px;font-size:14px;font-weight:800;color:var(--c,var(--accent-ink));line-height:1.2}
  .tcard .big{font-size:26px;font-weight:900;color:var(--ink);line-height:1.1}
  .tcard .big small{display:block;font-size:10.5px;color:var(--muted);font-weight:500;margin-top:2px}
  .tcard .row2{display:flex;gap:12px;margin-top:10px}
  .tcard .row2 span{font-size:10.5px;color:var(--muted);font-weight:500;text-align:center}
  .tcard .row2 b{display:block;color:var(--ink);font-weight:900;font-size:14px;margin-top:2px}
  .tcard .row2 b.good{color:var(--good)}
  .tcard .row2 b.bad{color:var(--bad)}

  /* ===== سابمت ===== */
  .submit-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;
    padding:14px 16px;border-bottom:1px solid var(--line);background:#f9fafd}
  .submit-toolbar .field label{font-size:12px;color:var(--muted);font-weight:500}
  .submit-hint{font-size:12px;color:var(--muted);align-self:center;max-width:340px}
  .submit-hint a{color:var(--accent);font-weight:700}
  .submit-body{padding:24px 16px;display:flex;justify-content:center}

  /* جدول السابمت: أسماء الكيوسيهات على الشمال، وعلى اليمين FP و QA و Total */
  .submit-table{width:100%;max-width:640px;direction:ltr;
    border-collapse:separate;border-spacing:0;
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .submit-table th,.submit-table td{text-align:center;padding:10px 12px;
    border-bottom:1px solid var(--line);white-space:nowrap}
  .submit-table th+th,.submit-table td+td{border-inline-start:1px solid var(--line)}
  .submit-table thead th,
  .submit-table thead th:hover{position:static;cursor:default;background:#343b4a;color:#fff;
    font-size:14px;font-weight:800;padding:12px;border-bottom:none}
  .submit-table .s-name-cell{color:#fff;font-weight:800;font-size:14px;min-width:170px}
  .submit-table td.s-val{font-weight:800;font-size:15px}
  .submit-table td.s-total{font-weight:900;font-size:15px;background:#f3f5fb;color:var(--accent-ink)}
  .submit-table input.submit-input{width:100%;max-width:120px;min-width:0;text-align:center;
    font-weight:800;font-size:15px;padding:7px 6px}
  .submit-table tbody tr:last-child td{border-bottom:none}
  .submit-table tfoot td{background:#1c2f66;color:#fff;font-weight:900;font-size:15px;border-bottom:none}
  input[type=number].submit-input::-webkit-outer-spin-button,
  input[type=number].submit-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input[type=number].submit-input{-moz-appearance:textfield}
  .submit-savebar{display:flex;justify-content:center;align-items:center;gap:12px;
    padding:16px;border-top:1px solid var(--line)}
  .submit-savebar button.primary{background:var(--accent-ink);border-color:var(--accent-ink);color:#fff}
  .submit-saved-note{font-size:12px;color:var(--good);font-weight:700}

  /* ===== يوم واحد ===== */
  .single-day-wrap{overflow-x:auto}
  table.single-day-table{width:100%;border-collapse:collapse;font-size:14px}
  .single-day-table thead th{position:sticky;top:0;background:#1c2f66;color:#fff;
    font-size:12px;font-weight:800;padding:9px 12px;text-align:center;z-index:2;cursor:default}
  .single-day-table thead th:hover{background:#1c2f66;color:#fff}
  .single-day-table td{padding:8px 12px;border-bottom:1px solid #eef1f7;text-align:center;vertical-align:middle}
  .single-day-table td.sd-empty{color:var(--muted);font-weight:600;padding:16px}

  .single-day-table tbody tr:hover td:not(.sd-team-cell){background:#f4f7ff}
  /* خانة الكيوسي: لون واحد ثابت (solid) */
  .sd-team-cell,
  .sd-team-cell:hover,
  .sd-team-cell:focus,
  tr:hover .sd-team-cell{
    text-align:center;vertical-align:middle;
    border-bottom:3px solid rgba(255,255,255,.35);min-width:130px;padding:10px 8px;
    background-image:none !important;background-color:var(--team-c1) !important
  }
  .sd-team-box{display:inline-block;padding:9px 16px;border-radius:9px;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);
    color:#fff;font-weight:900;font-size:14px;line-height:1.4}
  .sd-team-cell .tsub{display:block;font-size:10.5px;font-weight:600;opacity:.92;margin-top:3px}

  /* الاسم واليوزر: بوكس واضح + خط أوضح وأكبر */
  .sd-box{display:inline-block;padding:6px 13px;border-radius:8px;background:#f1f4fb;border:1px solid #e0e6f3;direction:ltr}
  .sd-name{font-family:var(--font-latin);font-weight:600;font-size:14.5px;color:#0f172a;letter-spacing:.1px}
  .sd-name.empty{font-family:"Tajawal",sans-serif;color:var(--muted);font-weight:600;direction:rtl}
  .sd-uid{font-family:var(--font-mono);direction:ltr;color:#1e293b;font-size:13px;font-weight:500;letter-spacing:.1px}

  .sd-hours{display:inline-flex;align-items:center;justify-content:center;
    width:46px;height:46px;border-radius:50%;
    font-weight:900;font-size:13px;transition:transform .12s ease,box-shadow .12s ease}
  .sd-hours.bad{background:var(--bad-bg);color:var(--bad)}
  .sd-hours.ok{background:var(--good-bg);color:var(--good)}
  .sd-hours:hover{transform:scale(1.08);box-shadow:0 0 0 3px var(--glow),0 8px 18px rgba(0,0,0,.18);cursor:default}

  /* الحضور: P / PT */
  .att{display:inline-block;min-width:42px;padding:4px 11px;border-radius:8px;
    font-family:var(--font-latin);font-weight:700;font-size:13.5px;letter-spacing:.3px;border:1px solid transparent}
  .att-p{background:var(--good-bg);color:var(--good);border-color:#bfe6cf}
  .att-pt{background:var(--warn-bg);color:var(--warn);border-color:#f4dba0}
  .att-other{background:#eef1fb;color:var(--accent-ink);border-color:#d5dcf0}
  .att-none{color:var(--muted);font-weight:600}

  .sd-count{display:inline-block;min-width:34px;padding:3px 10px;border-radius:8px;font-weight:800;font-size:13.5px}
  .sd-count.bad{background:var(--bad-bg);color:var(--bad)}
  .sd-count.ok{background:var(--good-bg);color:var(--good)}
  .sd-count.plain{background:#eef1fb;color:var(--accent-ink)}

  /* شريط عنوان الصورة (بيظهر بس وإحنا بنجهّز صورة اللي مش محقق) */
  .capture-banner{padding:12px 16px;background:var(--bad-bg);color:#991b1b;font-weight:800;font-size:14px;
    border-bottom:1px solid #f5b8b3}

  @media (max-width:640px){
    .stat{flex:1 1 45%}
    h1{font-size:19px}
    input{min-width:135px}
    header{padding:16px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>SF Dashboard
      <small id="sub">جاري التحميل…</small>
    </h1>
    <div class="head-actions">
      <button id="img" class="ghost">تنزيل صورة</button>
      <button id="reload" class="primary">تحديث الداتا</button>
    </div>
  </header>

  <div id="capture">
    <div class="stats" id="stats"></div>

    <div class="filters">
      <div class="field">
        <label for="q">دور على يوزر أو اسم (اكتب الأرقام بس)</label>
        <input type="search" id="q" list="userlist" placeholder="123456" autocomplete="off">
        <datalist id="userlist"></datalist>
      </div>

      <!-- فلتر التاريخ العام (كل اليوزرات / متوسط الفرق) -->
      <div class="field" id="fFrom">
        <label for="from">من تاريخ</label>
        <input type="date" id="from">
      </div>
      <div class="field" id="fTo">
        <label for="to">لغاية تاريخ</label>
        <input type="date" id="to">
      </div>

      <!-- فلتر تاب "يوم واحد": بيفتح على النهاردة، ولو عايز فترة اختار من يوم لغاية يوم -->
      <div class="field" id="fSdFrom" style="display:none">
        <label for="sdFrom">من يوم</label>
        <input type="date" id="sdFrom">
      </div>
      <div class="field" id="fSdTo" style="display:none">
        <label for="sdTo">لغاية يوم</label>
        <input type="date" id="sdTo">
      </div>
      <button id="sdToday" style="display:none">النهاردة</button>

      <label class="check"><input type="checkbox" id="onlyBad"> تحت التارجت بس</label>
      <button id="reset">مسح الفلاتر</button>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-users" aria-selected="true">كل اليوزرات</button>
      <button class="tab" role="tab" id="tab-single" aria-selected="false">يوم واحد</button>
      <button class="tab" role="tab" id="tab-teams" aria-selected="false">متوسط الفرق (QC)</button>
      <button class="tab" role="tab" id="tab-submit" aria-selected="false">سابمت</button>
    </div>

    <div class="panel">
      <div id="out"><div class="note">جاري تحميل الداتا من جوجل شيت…</div></div>
    </div>
  </div>

  <div class="foot">
    <span id="count"></span>
    <span id="stamp"></span>
  </div>

</div>

<script>
/* ===== إعدادات ===== */
var API = "https://script.google.com/macros/s/AKfycbzoZuqCeMHQd37WmloJU98nvzIE-6Rb8TIBdJRd5k8ND72rNeka-8Wu9DXn5NSgzqYaXA/exec";
var DEFAULT_FROM = "2026-08-25";
var AUTO_REFRESH_MS = 5 * 60 * 1000;   /* تحديث تلقائي هادي كل 5 دقايق (الأسماء بتتحدّث معاه) */

var TEAM_ORDER = ["Mira Samir","Eman Gamal","Shimaa Nasser","Eslam Ali","Ahmed Adel","Buffer"];

/* لون الكيوسي: لون واحد ثابت (solid) في كل مكان — تغييره من هنا بس.
   نفس الـ string بيتحط مباشرة (من غير object مشترك) عشان يبقى فعلاً نفس
   اللون بالظبط في كل تاب (كل اليوزرات / يوم واحد / متوسط الفرق / سابمت). */
var QC_COLOR = "#183a6b";
function teamColor_(team) {
  return { c: QC_COLOR, c2: QC_COLOR };
}
var NO_TEAM = teamColor_("Buffer");

var SUBMIT_LABELS = { "Buffer": "Ibrahim Mohamed" };

var DAY_NAMES = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];

var state = {

  capturing: false
};
var sdLast = { from: "", to: "" };

/* ===== JSONP ===== */
function jsonp(url, cb, onErr) {
  var name = "cb_" + Date.now() + Math.floor(Math.random() * 1e6);
  var s = document.createElement("script");
  var done = false;
  var timer = setTimeout(function () {
    if (!done) { cleanup(); onErr("الطلب أخد وقت طويل. اتأكد إن الـ deployment شغال ومتاح لأي حد."); }
  }, 40000);
  window[name] = function (d) { done = true; clearTimeout(timer); cleanup(); cb(d); };
  function cleanup() { try { delete window[name]; } catch (e) { window[name] = undefined; } s.remove(); }
  s.src = url + (url.indexOf("?") === -1 ? "?" : "&") + "callback=" + name + "&_=" + Date.now();
  s.onerror = function () {
    if (!done) { clearTimeout(timer); cleanup(); onErr("مش قادر يوصل للويب آب. راجع اللينك وصلاحيات الـ deployment."); }
  };
  document.body.appendChild(s);
}

/* ===== تاريخ اليوم بالتوقيت المحلي (yyyy-mm-dd) ===== */
function todayStr() {
  var d = new Date();
  var local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return local.toISOString().slice(0, 10);
}

/* اسم اليوم بالعربي من تاريخ yyyy-mm-dd */
function dayName_(iso) {
  var p = String(iso || "").split("-");
  if (p.length !== 3) return "";
  var d = new Date(+p[0], +p[1] - 1, +p[2]);
  return isNaN(d) ? "" : DAY_NAMES[d.getDay()];
}

/* ===== تحميل ===== */
/* بنحمّل كل الداتا من MIN_DATE، وفلترة التاريخ بتتم في المتصفح.
   silent === true: تحديث تلقائي من غير رسايل تحميل ولا مسح للشاشة لو فشل */
function load(silent) {
  silent = (silent === true);
  var btn = document.getElementById("reload");
  if (!silent) {
    btn.disabled = true; btn.textContent = "بيحمّل…";
    document.getElementById("out").innerHTML = '<div class="note">جاري تحميل الداتا…</div>';
  }

  jsonp(API + "?action=data", function (res) {
    if (!silent) { btn.disabled = false; btn.textContent = "تحديث الداتا"; }
    if (!res || !res.ok) return fail((res && res.error) || "الويب آب رجّع رد مش مفهوم.");

    state.rows = res.rows || [];
    state.target = res.target || 5.5;
    var keepTeams = silent && state.view === "teams";
    if (!keepTeams) state.teams = null;

    if (res.minDate) {
      ["from", "to", "sdFrom", "sdTo"].forEach(function (id) {
        document.getElementById(id).min = res.minDate;
      });
    }

    var users = {};
    state.rows.forEach(function (r) { users[r.user] = 1; });
    document.getElementById("userlist").innerHTML =
      Object.keys(users).sort().map(function (u) { return '<option value="' + esc(u) + '">'; }).join("");

    var covTxt = (res.meta && res.meta.namesCoverage != null) ? " · الأسماء متاحة لـ " + res.meta.namesCoverage + "% من السجلات" : "";
    var st = res.meta && res.meta.namesStatus;
    var warnTxt = "";
    if (st && st.external && st.external !== "ok") warnTxt = " · ⚠ شيت الأسماء الخارجي مش متاح (بيستخدم الأسماء الاحتياطية)";
    else if (st && st.gidFallback) warnTxt = " · ⚠ تاب الأسماء (gid) مش لاقيه، بيقرا أول تاب";
    document.getElementById("sub").textContent = state.rows.length
      ? "التارجت " + state.target + " ساعة · بيانات من " + res.minDate + covTxt + warnTxt
      : "مفيش داتا من " + (res.minDate || "التاريخ المحدد");
    document.getElementById("stamp").textContent =
      "آخر تحديث: " + new Date(res.generatedAt).toLocaleString("ar-EG");

    if (!state.rows.length && state.view !== "submit") return noData();

    render();
    if (keepTeams) loadTeams(renderTeamsTab);   /* نجدد كروت الفرق من غير ما الشاشة تفضى */
  }, fail);

  function fail(msg) {
    if (silent) return;
    btn.disabled = false; btn.textContent = "تحديث الداتا";
    document.getElementById("out").innerHTML = '<div class="note error">' + esc(msg) + '</div>';
  }
}

function loadTeams(cb) {
  var qs = "?action=teams";
  var from = document.getElementById("from").value;
  var to = document.getElementById("to").value;
  if (from) qs += "&from=" + encodeURIComponent(from);
  if (to) qs += "&to=" + encodeURIComponent(to);

  jsonp(API + qs, function (res) {
    if (!res || !res.ok) { document.getElementById("out").innerHTML =
      '<div class="note error">' + esc((res && res.error) || "تعذر تحميل بيانات الفرق.") + '</div>'; return; }
    state.teams = res.teams || [];
    cb();
  }, function (msg) {
    document.getElementById("out").innerHTML = '<div class="note error">' + esc(msg) + '</div>';
  });
}

/* ===== سابمت: تحميل الداتا المحفوظة من الشيت ===== */
function loadSubmitData(cb) {
  jsonp(API + "?action=submitData", function (res) {
    if (!res || !res.ok) {
      document.getElementById("out").innerHTML =
        '<div class="note error">' + esc((res && res.error) || "تعذر تحميل بيانات السابمت.") + '</div>';
      return;

    state.submitSheetUrl = res.sheetUrl || "";
    cb();
  }, function (msg) {
    document.getElementById("out").innerHTML = '<div class="note error">' + esc(msg) + '</div>';
  });
}

function noData() {
  document.getElementById("stats").innerHTML = "";
  document.getElementById("out").innerHTML =
    '<div class="note">مفيش سجلات في النطاق ده.<br><br>' +
    'الداتا متاحة بس من <code>' + esc(DEFAULT_FROM) + '</code> فما بعد.<br>' +
    '<a href="' + API + '?action=debug" target="_blank" rel="noopener">فتح صفحة التشخيص</a></div>';
}

/* ===== فلترة ===== */
function digits(s) { return String(s).replace(/\D+/g, ""); }

function matchUser(user, name, q) {
  if (!q) return true;
  var lower = q.toLowerCase();
  if (user.toLowerCase().indexOf(lower) > -1) return true;
  if (name && name.toLowerCase().indexOf(lower) > -1) return true;
  var qd = digits(q);
  if (qd && digits(user).indexOf(qd) > -1) return true;
  return false;
}

/* فلتر تاب "كل اليوزرات": بحث + تحت التارجت + من/لغاية تاريخ */
function filtered() {
  var q = document.getElementById("q").value.trim();
  var bad = document.getElementById("onlyBad").checked;
  var from = document.getElementById("from").value;
  var to = document.getElementById("to").value;
  return state.rows.filter(function (r) {
    if (from && r.date < from) return false;
    if (to && r.date > to) return false;
    if (!matchUser(r.user, r.name, q)) return false;
    if (bad && r.hours >= state.target) return false;
    return true;
  });
}

function groupUsers(rows) {
  var m = {};
  rows.forEach(function (r) {
    var u = m[r.user] || (m[r.user] = { user: r.user, name: r.name, team: r.team, rooms: {}, total: 0, sum: 0, missed: [] });
    u.rooms[r.room] = 1; u.total++; u.sum += r.hours;
    if (r.hours < state.target) u.missed.push(r);
  });
  return Object.keys(m).map(function (k) {
    var u = m[k];
    u.avg = u.total ? u.sum / u.total : 0;
    u.pct = u.total ? u.missed.length / u.total : 0;
    u.roomText = Object.keys(u.rooms).join("، ");
    u.missedCount = u.missed.length;
    u.missed.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    return u;
  });
}

/* ===== رسم ===== */
function render() {
  if (state.view === "submit") { renderSubmitTab(); return; }
  if (!state.rows.length) return noData();
  if (state.view === "teams") { renderTeamsTab(); return; }
  if (state.view === "single") { renderSingleDay(); return; }
  var rows = filtered();
  renderStats(rows);
  renderUsers(rows);
}

function renderStats(rows) {
  var users = {}, badUsers = {}, bad = 0, sum = 0;
  rows.forEach(function (r) {
    users[r.user] = 1; sum += r.hours;
    if (r.hours < state.target) { bad++; badUsers[r.user] = 1; }
  });
  document.getElementById("stats").innerHTML =
    stat(Object.keys(users).length, "يوزر", "#0f9d58") +
    stat(rows.length, "سجل", "#5b3aa8") +
    stat(bad, "يوم تحت التارجت", "#dc2626") +
    stat(Object.keys(badUsers).length, "يوزر عنده يوم ناقص", "#b5820a") +
    stat(rows.length ? (sum / rows.length).toFixed(2) : "0.00", "متوسط الساعات", "#2b4b8f");
}
function stat(v, label, color) {
  return '<div class="stat" style="--c:' + color + '"><b>' + v + '</b><span>' + label + '</span></div>';
}

function nameCell(name) {
  return name ? '<span class="name">' + esc(name) + '</span>' : '<span class="name empty">—</span>';
}

/* الحضور: P / PT (أي قيمة تانية بتظهر زي ما هي) */
function attBadge(att) {
  var v = String(att == null ? "" : att).trim();
  if (!v) return '<span class="att att-none">—</span>';
  var u = v.toUpperCase();
  var cls = (u === "P") ? "att-p" : (u === "PT" ? "att-pt" : "att-other");
  return '<span class="att ' + cls + '">' + esc(v) + '</span>';
}

/* --- كل اليوزرات: مجمّعة بالفريق زي شكل الروستر (Buffer ظاهر هنا كفريق زي باقي الكيوسيهات) --- */
function renderUsers(rows) {
  var list = groupUsers(rows);
  document.getElementById("count").textContent = list.length + " يوزر معروض";
  if (!list.length) return empty();

  var groups = {};
  list.forEach(function (u) {
    var key = u.team || "بدون فريق معروف";
    (groups[key] || (groups[key] = [])).push(u);
  });

  var orderedKeys = TEAM_ORDER.filter(function (k) { return groups[k]; })
    .concat(Object.keys(groups).filter(function (k) { return TEAM_ORDER.indexOf(k) === -1; }));

  var html = '<table><tbody>';
  orderedKeys.forEach(function (key) {
    var members = groups[key].sort(function (a, b) { return b.missedCount - a.missedCount; });
    var col = teamColor_(key);
    var groupAvg = members.reduce(function (s, u) { return s + u.avg; }, 0) / members.length;

    html += '<tr class="group-head" style="--c:' + col.c + '">' +
      '<td colspan="9">' + esc(key) +
      '<span class="gsub">' + members.length + ' يوزر · متوسط الفريق ' + groupAvg.toFixed(2) + ' ساعة</span>' +
      '</td></tr>';

    html += '<tr style="background:#f7f8fc">' +
      '<th style="position:static">الاسم</th><th style="position:static">اليوزر</th><th style="position:static">الروم</th>' +
      '<th style="position:static">أيام مسجلة</th><th style="position:static">أيام ناقصة</th>' +
      '<th style="position:static">نسبة النقص</th><th style="position:static">متوسط الساعات</th>' +
      '<th style="position:static">إجمالي الساعات</th><th style="position:static">التفاصيل</th></tr>';

    members.forEach(function (u) {
      var pct = Math.round(u.pct * 100);
      var open = !!state.open[u.user];
      html += '<tr>' +
        '<td>' + nameCell(u.name) + '</td>' +
        '<td class="mono">' + esc(u.user) + '</td>' +
        '<td>' + esc(u.roomText) + '</td>' +
        '<td class="num">' + u.total + '</td>' +
        '<td class="miss' + (u.missedCount ? '' : ' zero') + '">' + u.missedCount + '</td>' +
        '<td><div class="bar' + (u.missedCount ? '' : ' ok') + '"><b style="width:' + pct + '%"></b></div>' +
          '<span style="font-size:12px;color:var(--muted)">' + pct + '%</span></td>' +
        '<td class="num">' + u.avg.toFixed(2) + '</td>' +
        '<td class="num">' + u.sum.toFixed(2) + '</td>' +
        '<td>' + (u.missedCount
          ? '<button class="toggle" data-u="' + esc(u.user) + '">' + (open ? "إخفاء" : "الأيام الناقصة") + '</button>'
          : '<span style="color:var(--muted)">—</span>') + '</td>' +
        '</tr>';

      if (open && u.missedCount) {
        html += '<tr class="detail"><td colspan="9">' + missedDays(u.missed) + '</td></tr>';
      }
    });
  });

  document.getElementById("out").innerHTML = html + '</tbody></table>';
  Array.prototype.forEach.call(document.querySelectorAll(".toggle"), function (b) {
    b.onclick = function () {
      var u = b.getAttribute("data-u");
      state.open[u] = !state.open[u];
      render();
    };
  });
}

/* الأيام الناقصة: كل يوم كارت — التاريخ في مربع والساعات في دايرة، والكارت بيبرز لما توقف عليه */
function missedDays(missed) {
  var h = '<div class="days-wrap"><div class="days-title">الأيام الناقصة<span>(' + missed.length + ')</span></div>' +
    '<div class="days-grid">';
  missed.forEach(function (m) {
    h += '<div class="day-card">' +
      '<div class="day-date"><b>' + esc(m.date) + '</b><small>' + esc(dayName_(m.date)) + '</small></div>' +
      '<span class="day-hours">' + m.hours.toFixed(2) + '</span>' +
      '</div>';
  });
  return h + '</div></div>';
}

/* --- يوم واحد: بيفتح على النهاردة تلقائي، ولو عايز فترة اختار من يوم لغاية يوم (من غير تيم Buffer) --- */
function latestDate_() {
  var m = "";
  state.rows.forEach(function (r) { if (r.team !== "Buffer" && r.date > m) m = r.date; });
  return m;
}

function singleRange_() {
  var f = document.getElementById("sdFrom").value;
  var t = document.getElementById("sdTo").value;
  if (!f && !t) { f = t = todayStr(); }
  if (!f) f = t;
  if (!t) t = f;
  if (f > t) { var x = f; f = t; t = x; }
  return { from: f, to: t };
}

function renderSingleDay() {
  document.getElementById("stats").innerHTML = "";
  var elFrom = document.getElementById("sdFrom");
  var elTo = document.getElementById("sdTo");
  if (state.sdAuto) { var t0 = todayStr(); elFrom.value = t0; elTo.value = t0; }

  var rg = singleRange_();
  sdLast = { from: rg.from, to: rg.to };
  var isRange = rg.from !== rg.to;
  var label = isRange ? ("من " + rg.from + " إلى " + rg.to) : rg.from;
  var T = state.target;
  var q = document.getElementById("q").value.trim();
  var onlyBad = document.getElementById("onlyBad").checked || state.captureBad;

  var base = state.rows.filter(function (r) {
    return r.date >= rg.from && r.date <= rg.to && r.team !== "Buffer" && matchUser(r.user, r.name, q);
  });

  if (!base.length) {
    document.getElementById("count").textContent = "";
    var last = latestDate_();
    var msg = '<div class="note">مفيش سجلات ' + (isRange ? "في الفترة دي" : "ليوم " + esc(rg.from)) + '.';
    if (last && last < rg.from) {
      msg += '<br><br><button id="sdGoLast">روح لآخر يوم فيه داتا (' + esc(last) + ')</button>';
    }
    msg += '</div>';
    document.getElementById("out").innerHTML = msg;
    var goLast = document.getElementById("sdGoLast");
    if (goLast) goLast.onclick = function () {
      state.sdAuto = false;
      elFrom.value = last; elTo.value = last;
      render();
    };
    return;
  }

  /* entries: صف لكل سجل (يوم واحد) — أو صف لكل يوزر بمتوسط ساعاته (فترة) */
  var entries = [];
  if (!isRange) {
    base.forEach(function (r) {
      entries.push({ user: r.user, name: r.name, team: r.team || "", hours: r.hours, att: r.att, days: 1, missed: r.hours < T ? 1 : 0 });
    });
  } else {
    var by = {};
    base.forEach(function (r) {
      var u = by[r.user] || (by[r.user] = { user: r.user, name: r.name, team: r.team || "", sum: 0, days: 0, missed: 0 });
      u.sum += r.hours; u.days++;
      if (r.hours < T) u.missed++;
      if (!u.name && r.name) u.name = r.name;
    });
    Object.keys(by).forEach(function (k) {
      var u = by[k];
      entries.push({ user: u.user, name: u.name, team: u.team, hours: u.sum / u.days, att: "", days: u.days, missed: u.missed });
    });
  }

  var groups = {};
  entries.forEach(function (e) {
    var key = e.team || "بدون فريق معروف";
    (groups[key] || (groups[key] = [])).push(e);
  });
  var orderedKeys = TEAM_ORDER.filter(function (k) { return groups[k]; })
    .concat(Object.keys(groups).filter(function (k) { return TEAM_ORDER.indexOf(k) === -1; }));

  var head = isRange
    ? '<th>متوسط الساعات</th><th>أيام مسجلة</th><th>أيام ناقصة</th>'
    : '<th>الساعات</th><th>الحضور</th>';

  var html = '<div class="single-day-wrap"><table class="single-day-table"><thead><tr>' +
    head + '<th>الاسم</th><th>اليوزر</th><th>الفريق (QC)</th>' +
    '</tr></thead><tbody>';

  var shownCount = 0, shownUsers = {};

  orderedKeys.forEach(function (key) {
    var all = groups[key];
    var shown = onlyBad ? all.filter(function (e) { return e.hours < T; }) : all;
    if (!shown.length) return;
    shown = shown.slice().sort(function (a, b) { return a.hours - b.hours; });

    var col = teamColor_(key);
    var below = all.filter(function (e) { return e.hours < T; }).length;
    var uniq = {};
    all.forEach(function (e) { uniq[e.user] = 1; });
    var usersN = Object.keys(uniq).length;
    var avg = all.reduce(function (s, e) { return s + e.hours; }, 0) / all.length;

    shown.forEach(function (e, i) {
      var bad = e.hours < T;
      shownCount++; shownUsers[e.user] = 1;
      html += '<tr>' +
        '<td><span class="sd-hours ' + (bad ? "bad" : "ok") + '">' + e.hours.toFixed(2) + '</span></td>';
      if (isRange) {
        html += '<td><span class="sd-count plain">' + e.days + '</span></td>' +
          '<td><span class="sd-count ' + (e.missed ? "bad" : "ok") + '">' + e.missed + '</span></td>';
      } else {
        html += '<td>' + attBadge(e.att) + '</td>';
      }
      html += '<td><span class="sd-box sd-name' + (e.name ? "" : " empty") + '">' + (e.name ? esc(e.name) : "بدون اسم") + '</span></td>' +
        '<td><span class="sd-box sd-uid">' + esc(e.user) + '</span></td>';
      if (i === 0) {
        html += '<td class="sd-team-cell" rowspan="' + shown.length + '" style="--team-c1:' + col.c + '">' +
          '<span class="sd-team-box">' + esc(key) +
          '<span class="tsub">' + usersN + ' يوزر · ' + below + ' تحت التارجت</span>' +
          '<span class="tsub">متوسط ' + avg.toFixed(2) + ' ساعة</span></span></td>';
      }
      html += '</tr>';
    });
  });

  html += '</tbody></table></div>';

  if (!shownCount) {
    document.getElementById("count").textContent = "";
    document.getElementById("out").innerHTML =
      '<div class="note">كل اليوزرات محققة التارجت ' + (isRange ? "في الفترة دي" : "في اليوم ده") + ' ✅</div>';
    return;
  }

  document.getElementById("count").textContent =
    Object.keys(shownUsers).length + " يوزر · " + label + (isRange ? " (متوسط الساعات لكل يوزر)" : "");

  var banner = state.captureBad
    ? '<div class="capture-banner">اليوزرات اللي محققتش التارجت (' + T + ' ساعة) · ' + esc(label) + '</div>'
    : '';

  document.getElementById("out").innerHTML = banner + html;
}

/* --- متوسط الفرق (QC) — الكيوسيهات الخمسة بس (من غير Buffer، ده بقى بيظهر في تاب "كل اليوزرات") --- */
function renderTeamsTab() {
  document.getElementById("stats").innerHTML = "";
  if (state.teams === null) {
    document.getElementById("out").innerHTML = '<div class="note">جاري تحميل بيانات الفرق…</div>';
    loadTeams(renderTeamsTab);
    return;
  }
  var teams = state.teams.filter(function (t) { return t.tl !== "Buffer"; });
  document.getElementById("count").textContent = teams.length + " فريق";
  if (!teams.length) {
    document.getElementById("out").innerHTML = '<div class="note">مفيش سجلات لرومات الفرق المعروفة في النطاق الحالي.</div>';
    return;
  }

  var html = '<div class="teamcard">';
  teams.forEach(function (t) {
    var achievedPct = Math.round(t.achievedPct * 100);
    var col = teamColor_(t.tl);
    html += '<div class="tcard" style="--c:' + col.c + '">' +
      '<h3>' + esc(t.tl) + '</h3>' +
      '<div class="big">' + t.avgHours.toFixed(2) + '<small>ساعة/يوم</small></div>' +
      '<div class="row2">' +
        '<span>عدد الأفراد<b>' + t.members + '</b></span>' +
        '<span>محقق الساعات<b class="' + (achievedPct >= 70 ? "good" : "bad") + '">' + achievedPct + '%</b></span>' +
      '</div>' +
      '</div>';
  });
  html += '</div>';

  document.getElementById("out").innerHTML = html;
}

function empty() {
  document.getElementById("out").innerHTML =
    '<div class="note">مفيش نتايج بالفلاتر دي. امسح الفلاتر أو وسّع نطاق التاريخ.</div>';
}

/* --- سابمت: جدول (كيوسي | FP | QA | Total) — إدخال يومي + إجمالي لأي مدى --- */
function sumSubmit_(team, from, to) {
  var fp = 0, qa = 0;
  state.submitRows.forEach(function (r) {
    if (r.team !== team) return;
    if (r.date < from || r.date > to) return;
    fp += r.fp; qa += r.qa;
  });
  return { fp: fp, qa: qa, total: fp + qa };
}

function submitInput_(team, field) {
  var el = document.querySelector('input[data-team="' + team + '"][data-field="' + field + '"]');
  var n = (el && el.value !== "") ? Number(el.value) : 0;
  return (isFinite(n) && n > 0) ? Math.round(n) : 0;
}

/* بيحسب التوتال لكل كيوسي وإجمالي العمودين لحظيًا وإنت بتكتب */
function recalcSubmit_() {
  var sumFp = 0, sumQa = 0;
  SUBMIT_TEAMS.forEach(function (team, i) {
    var fp = submitInput_(team, "fp"), qa = submitInput_(team, "qa");
    sumFp += fp; sumQa += qa;
    var cell = document.getElementById("sTot" + i);
    if (cell) cell.textContent = fp + qa;
  });
  document.getElementById("sSumFp").textContent = sumFp;
  document.getElementById("sSumQa").textContent = sumQa;
  document.getElementById("sSumAll").textContent = sumFp + sumQa;
}

function renderSubmitTab() {
  document.getElementById("stats").innerHTML = "";
  document.getElementById("count").textContent = "";

  if (state.submitRows === null) {
    document.getElementById("out").innerHTML = '<div class="note">جاري تحميل بيانات السابمت…</div>';
    loadSubmitData(renderSubmitTab);
    return;
  }

  if (!state.submitFrom) state.submitFrom = todayStr();
  if (!state.submitTo) state.submitTo = state.submitFrom;

  var from = state.submitFrom, to = state.submitTo;
  var isSingleDay = (from === to);

  var html = '<div class="submit-toolbar">' +
    '<div class="field"><label for="subFrom">من تاريخ</label><input type="date" id="subFrom" value="' + esc(from) + '"></div>' +
    '<div class="field"><label for="subTo">لغاية تاريخ</label><input type="date" id="subTo" value="' + esc(to) + '"></div>' +
    '<button id="subToday">النهاردة</button>' +
    '<button id="subRefresh">تحديث</button>' +
    '<span class="submit-hint">' + (isSingleDay
      ? "اكتب عدد الـ FP والـ QA لكل كيوسي وهيتجمعوا لوحدهم، وبعدين اضغط حفظ."
      : "عرض إجمالي للمدى المحدد (مش قابل للتعديل). اختار نفس اليوم في الحقلين عشان تدخل أرقام.") +
    (state.submitSheetUrl ? ' <a href="' + esc(state.submitSheetUrl) + '" target="_blank" rel="noopener">فتح شيت السابمت</a>' : '') +
    '</span></div>';

  html += '<div class="submit-body"><table class="submit-table" dir="ltr"><thead><tr>' +
    '<th>Team Lead / QC</th><th>FP</th><th>QA</th><th>Total</th></tr></thead><tbody>';

  var gFp = 0, gQa = 0;
  SUBMIT_TEAMS.forEach(function (team, i) {
    var s = sumSubmit_(team, from, to);
    gFp += s.fp; gQa += s.qa;
    var col = teamColor_(team);

    html += '<tr><td class="s-name-cell" style="background:' + col.c + '">' + esc(SUBMIT_LABELS[team] || team) + '</td>';
    if (isSingleDay) {
      html += '<td><input type="number" min="0" step="1" class="submit-input" data-team="' + esc(team) +
        '" data-field="fp" value="' + (s.fp || "") + '" placeholder="0"></td>' +
        '<td><input type="number" min="0" step="1" class="submit-input" data-team="' + esc(team) +
        '" data-field="qa" value="' + (s.qa || "") + '" placeholder="0"></td>';
    } else {
      html += '<td class="s-val">' + s.fp + '</td><td class="s-val">' + s.qa + '</td>';
    }
    html += '<td class="s-total" id="sTot' + i + '">' + s.total + '</td></tr>';
  });

  html += '</tbody><tfoot><tr><td>الإجمالي</td>' +
    '<td id="sSumFp">' + gFp + '</td><td id="sSumQa">' + gQa + '</td><td id="sSumAll">' + (gFp + gQa) + '</td>' +
    '</tr></tfoot></table></div>';

  if (isSingleDay) {
    html += '<div class="submit-savebar"><button id="subSave" class="primary">حفظ أرقام السابمت</button>' +
      '<span class="submit-saved-note">' + esc(state.submitSavedNote || "") + '</span></div>';
  }

  document.getElementById("out").innerHTML = html;

  document.getElementById("subFrom").onchange = function () {
    state.submitFrom = this.value || todayStr();
    state.submitSavedNote = "";
    render();
  };
  document.getElementById("subTo").onchange = function () {
    state.submitTo = this.value || state.submitFrom;
    state.submitSavedNote = "";
    render();
  };
  document.getElementById("subToday").onclick = function () {
    state.submitFrom = todayStr(); state.submitTo = state.submitFrom;
    state.submitSavedNote = "";
    render();
  };
  document.getElementById("subRefresh").onclick = function () {
    state.submitRows = null; state.submitSavedNote = "";
    render();
  };

  Array.prototype.forEach.call(document.querySelectorAll(".submit-input"), function (el) {
    el.addEventListener("input", recalcSubmit_);
  });

  var saveBtn = document.getElementById("subSave");
  if (saveBtn) saveBtn.onclick = function () { saveSubmitData(from); };
}

function saveSubmitData(date) {
  var btn = document.getElementById("subSave");
  btn.disabled = true; btn.textContent = "بيحفظ…";

  var items = SUBMIT_TEAMS.map(function (team) {
    return { team: team, fp: submitInput_(team, "fp"), qa: submitInput_(team, "qa") };
  });

  var qs = "?action=submitSave&date=" + encodeURIComponent(date) + "&data=" + encodeURIComponent(JSON.stringify(items));

  jsonp(API + qs, function (res) {
    if (!res || !res.ok) {
      alert((res && res.error) || "تعذر حفظ البيانات.");
      btn.disabled = false; btn.textContent = "حفظ أرقام السابمت";
      return;
    }
    state.submitRows = null;
    state.submitSavedNote = "اتحفظ ✓ " + new Date().toLocaleTimeString("ar-EG");
    loadSubmitData(function () { render(); });
  }, function (msg) {
    alert(msg);
    btn.disabled = false; btn.textContent = "حفظ أرقام السابمت";
  });
}

/* ===== تنزيل صورة =====
   في تاب "يوم واحد": الصورة بتطلع لليوزرات اللي محققتش التارجت بس.
   باقي التابات: الصورة زي ما هي. */
function downloadImage() {
  var btn = document.getElementById("img");
  var single = (state.view === "single");
  var fileName = "sf-dashboard-" + new Date().toISOString().slice(0, 10) + ".png";

  function finish() {
    state.capturing = false;
    if (single) { state.captureBad = false; render(); }
    btn.disabled = false; btn.textContent = "تنزيل صورة";
  }

  state.capturing = true;
  btn.disabled = true; btn.textContent = "بيجهّز الصورة…";

  if (single) {
    state.captureBad = true;
    renderSingleDay();
    if (!document.querySelector(".single-day-table")) {
      finish();
      alert("مفيش يوزرات تحت التارجت في اليوم/الفترة دي ✅ — مفيش صورة تتنزل.");
      return;
    }
    var rg = singleRange_();
    fileName = "sf-below-target-" + rg.from + (rg.from !== rg.to ? "_to_" + rg.to : "") + ".png";
  }

  html2canvas(document.getElementById("capture"), {
    backgroundColor: "#eef1f8",
    scale: 2,
    useCORS: true
  }).then(function (canvas) {
    canvas.toBlob(function (blob) {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = fileName;
      a.click();
      URL.revokeObjectURL(a.href);
      finish();
    });
  }).catch(function () {
    finish();
    alert("تعذر إنشاء الصورة. جرب تاني.");
  });
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

/* ===== الأحداث ===== */
/* التابات دي فلترتها بتتعمل في المتصفح — تاب السابمت بيتخطى عشان مانمسحش أرقام لسه متكتبتش */
function refresh() {
  if (state.view === "submit") return;
  render();
}

["from", "to"].forEach(function (id) {
  document.getElementById(id).addEventListener("change", function () {
    if (state.view === "teams") state.teams = null;   /* الفرق بتتحمّل من السيرفر بنفس المدى */
    refresh();
  });
});

/* تاب يوم واحد: لو كان يوم واحد وغيّرت "من يوم" بيمشي معاه "لغاية يوم"، ولو عايز فترة غيّر "لغاية يوم" بعدها */
document.getElementById("sdFrom").addEventListener("change", function () {
  var elFrom = document.getElementById("sdFrom"), elTo = document.getElementById("sdTo");
  state.sdAuto = false;
  var wasSingle = (sdLast.from === sdLast.to);
  if (!elTo.value || wasSingle || elTo.value < elFrom.value) elTo.value = elFrom.value;
  render();
});
document.getElementById("sdTo").addEventListener("change", function () {
  var elFrom = document.getElementById("sdFrom"), elTo = document.getElementById("sdTo");
  state.sdAuto = false;
  if (!elFrom.value || elTo.value < elFrom.value) elFrom.value = elTo.value;
  render();
});
document.getElementById("sdToday").onclick = function () {
  state.sdAuto = true;
  render();
};

document.getElementById("onlyBad").addEventListener("change", refresh);
document.getElementById("q").addEventListener("input", refresh);

document.getElementById("reset").onclick = function () {
  document.getElementById("from").value = DEFAULT_FROM;
  document.getElementById("to").value = "";
  document.getElementById("q").value = "";
  document.getElementById("onlyBad").checked = false;
  state.sdAuto = true;
  state.open = {};
  load();
};

document.getElementById("tab-users").onclick = function () { setView("users"); };
document.getElementById("tab-single").onclick = function () { setView("single"); };
document.getElementById("tab-teams").onclick = function () { setView("teams"); };
document.getElementById("tab-submit").onclick = function () { setView("submit"); };
function setView(v) {
  state.view = v;
  ["users", "single", "teams", "submit"].forEach(function (id) {
    document.getElementById("tab-" + id).setAttribute("aria-selected", v === id);
  });
  var single = (v === "single");
  document.getElementById("fFrom").style.display = single ? "none" : "flex";
  document.getElementById("fTo").style.display = single ? "none" : "flex";
  document.getElementById("fSdFrom").style.display = single ? "flex" : "none";
  document.getElementById("fSdTo").style.display = single ? "flex" : "none";
  document.getElementById("sdToday").style.display = single ? "inline-block" : "none";
  render();
}

document.getElementById("reload").onclick = function () { load(); };
document.getElementById("img").onclick = downloadImage;

/* تحديث تلقائي هادي (بيتخطى تاب السابمت، وبيتخطى وقت تجهيز الصورة) */
setInterval(function () {
  if (document.hidden || state.view === "submit" || state.capturing) return;
  load(true);
}, AUTO_REFRESH_MS);

/* ===== تشغيل ===== */
document.getElementById("from").value = DEFAULT_FROM;
document.getElementById("from").min = DEFAULT_FROM;
document.getElementById("sdFrom").value = todayStr();
document.getElementById("sdTo").value = todayStr();
load();
</script>
