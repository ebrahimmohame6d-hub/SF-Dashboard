</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>SF Dashboard
      <small id="sub"></small>
    </h1>
    <div class="head-actions">
      <button id="img" class="ghost">Download Image</button>
      <button id="reload" class="primary">Refresh Data</button>
    </div>
  </header>

  <div id="capture">
    <div class="stats" id="stats"></div>

    <div class="filters">
      <div class="field">
        <label for="q">Search by user or name (numbers only)</label>
        <input type="search" id="q" list="userlist" placeholder="123456" autocomplete="off">
        <datalist id="userlist"></datalist>
      </div>

      <!-- General date filter (all users / team averages) — the month selector fills these automatically -->
      <div class="field" id="fFrom">
        <label for="from">From date</label>
        <input type="date" id="from">
      </div>
      <div class="field" id="fTo">
        <label for="to">To date</label>
        <input type="date" id="to">
      </div>

      <!-- "Single Day" tab filter: empty fields = today automatically, and picking a date changes the data -->
      <div class="field" id="fSdFrom" style="display:none">
        <label for="sdFrom">From day</label>
        <input type="date" id="sdFrom">
      </div>
      <div class="field" id="fSdTo" style="display:none">
        <label for="sdTo">To day</label>
        <input type="date" id="sdTo">
      </div>

      <label class="check"><input type="checkbox" id="onlyBad"> Below target only</label>
      <button id="reset">Clear filters</button>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-users" aria-selected="true">All Users</button>
      <button class="tab" role="tab" id="tab-single" aria-selected="false">Single Day</button>
      <button class="tab" role="tab" id="tab-teams" aria-selected="false">QC</button>
      <button class="tab" role="tab" id="tab-submit" aria-selected="false">Submit</button>
      <button class="tab" role="tab" id="tab-hours" aria-selected="false">Team Hours</button>
    </div>

    <div class="panel">
      <div id="out"><div class="note">Loading data from the Google Sheet…</div></div>
    </div>
  </div>

  <div class="foot">
    <span id="count"></span>
    <span id="stamp"></span>
  </div>

</div>

<!-- Details modal -->
<div id="modal" class="modal-back" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle" dir="ltr">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button type="button" class="modal-x" id="modalClose" aria-label="Close">&times;</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
/* ===== Settings ===== */
var API = "https://script.google.com/macros/s/AKfycbzoZuqCeMHQd37WmloJU98nvzIE-6Rb8TIBdJRd5k8ND72rNeka-8Wu9DXn5NSgzqYaXA/exec";
var DEFAULT_FROM = "2026-08-25";
var AUTO_REFRESH_MS = 5 * 60 * 1000;   /* Quiet auto-refresh every 5 minutes (names update with it too) */

/* Which month opens by default in All Users / QC:
   "all"     = all data (like before)
   "current" = the current month (26th → 25th) */
var DEFAULT_MONTH = "all";

/* Target hours — used everywhere (All Users / Single Day / QC / Details / image) */
var TARGET_HOURS = 6.4;

var TEAM_ORDER = ["Mira Samir","Eman Gamal","Shimaa Nasser","Eslam Ali","Ahmed Adel","Buffer"];

/* Team color: one fixed (solid) color everywhere — change it here only.
   The same string is set directly (not via a shared object) so it's truly
   the exact same color in every tab (All Users / Single Day / Team Averages / Submit). */
var QC_COLOR = "#183a6b";
function teamColor_(team) {
  return { c: QC_COLOR, c2: QC_COLOR };
}
var NO_TEAM = teamColor_("Buffer");

/* Submit tab: order matches the Team Lead / QC sheet.
   The "Buffer" row's display name was changed to Ibrahim Mohamed
   (the internal key stays "Buffer" so the data already saved in the sheet keeps working). */
var SUBMIT_TEAMS = ["Shimaa Nasser","Ahmed Adel","Mira Samir","Eslam Ali","Eman Gamal","Rabab Gamal","Buffer"];
var SUBMIT_LABELS = { "Buffer": "Ibrahim Mohamed" };

var DAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

var state = {
  rows: [], target: TARGET_HOURS, view: "users",
  open: {}, teams: null,
  teamMembers: null,     /* { teamName: fixed roster member count } — loaded once from ?action=teams */
  month: "all",          /* "all" | "YYYY-MM" (26th of previous month → 25th of that month) | "custom" */
  submitRows: null, submitFrom: null, submitTo: null, submitSavedNote: "", submitSheetUrl: "",
  sdOpen: {},            /* users whose day details are open in the Single Day (period) tab */
  captureBad: false,     /* true = we're preparing an image of below-target users only */
  capturing: false,
  thTeam: "",             /* QC selected in the Team Hours tab */
  thWeek: "",             /* selected week's start date (yyyy-mm-dd) in the Team Hours tab */
  thRangeFrom: "", thRangeTo: ""   /* last rendered Team Hours range, used by the image download */
};

/* State of the open details modal: { user, month, from, to, below } */
var modalState = null;

/* ===== Month periods: month M = from the 26th of the previous month to the 25th of M =====
   Example: August 2026 = 2026-07-26 → 2026-08-25 */
var MONTHS_EN = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function pad2_(n) { return (n < 10 ? "0" : "") + n; }
function isoOf_(d) { return d.getFullYear() + "-" + pad2_(d.getMonth() + 1) + "-" + pad2_(d.getDate()); }

/* The period ("YYYY-MM") a date belongs to: the 26th and later count toward the next month */
function periodKeyOf_(dateStr) {
  var p = String(dateStr || "").split("-");
  var y = +p[0], m = +p[1], d = +p[2];
  if (!y || !m || !d) return "";
  if (d >= 26) { m++; if (m === 13) { m = 1; y++; } }
  return y + "-" + pad2_(m);
}

/* "2026-08" → { start:"2026-07-26", end:"2026-08-25", label:"August 2026", text:"26 Jul → 25 Aug 2026" } */
function periodRange_(key) {
  var p = key.split("-");
  var y = +p[0], m = +p[1];
  var s = new Date(y, m - 2, 26);     /* JS handles month -1 → December of the previous year */
  var e = new Date(y, m - 1, 25);
  var mon3 = function (d) { return MONTHS_EN[d.getMonth()].slice(0, 3); };
  return {
    start: isoOf_(s), end: isoOf_(e),
    label: MONTHS_EN[m - 1] + " " + y,
    text: s.getDate() + " " + mon3(s) + (s.getFullYear() !== e.getFullYear() ? " " + s.getFullYear() : "") +
          " → " + e.getDate() + " " + mon3(e) + " " + e.getFullYear()
  };
}

/* All periods that have data, newest first */
function periodKeys_() {
  var m = {};
  state.rows.forEach(function (r) { var k = periodKeyOf_(r.date); if (k) m[k] = 1; });
  return Object.keys(m).sort().reverse();
}

/* <option> list for a month select. sel = the selected value */
function monthOptionsHtml_(sel, customText) {
  var keys = periodKeys_();
  if (sel && sel !== "all" && sel !== "custom" && keys.indexOf(sel) === -1) {
    keys.push(sel); keys.sort().reverse();
  }
  var h = '<option value="all"' + (sel === "all" ? " selected" : "") + '>All months</option>';
  keys.forEach(function (k) {
    h += '<option value="' + k + '"' + (k === sel ? " selected" : "") + '>' + esc(periodRange_(k).label) + '</option>';
  });
  if (sel === "custom") h += '<option value="custom" selected>' + esc(customText || "Custom range") + '</option>';
  return h;
}

function monthRangeText_(sel, from, to) {
  if (sel === "all") return "All data";
  if (sel === "custom") return (from || "…") + " → " + (to || "…");
  return periodRange_(sel).text;
}

/* Month select + range text (used inside the dark team bar in All Users, and in the month bar) */
function monthBoxHtml_() {
  var f = document.getElementById("from").value, t = document.getElementById("to").value;
  return '<span class="mbox"><span class="mrange">' + esc(monthRangeText_(state.month, f, t)) + '</span>' +
    '<select class="month-sel" aria-label="Month">' + monthOptionsHtml_(state.month, (f || "…") + " → " + (t || "…")) + '</select></span>';
}

/* A small bar with the month select (used in QC and when no users match) */
function monthBarHtml_() {
  var f = document.getElementById("from").value, t = document.getElementById("to").value;
  return '<div class="month-bar"><b>Month</b>' +
    '<select class="month-sel" aria-label="Month">' + monthOptionsHtml_(state.month, (f || "…") + " → " + (t || "…")) + '</select>' +
    '<span class="mrange">' + esc(monthRangeText_(state.month, f, t)) + '</span></div>';
}

/* Fills the From / To fields from the selected month ("all" = empty fields) */
function applyMonthToInputs_() {
  var f = document.getElementById("from"), t = document.getElementById("to");
  if (state.month === "all") { f.value = ""; t.value = ""; return; }
  if (state.month === "custom") return;
  var p = periodRange_(state.month);
  f.value = p.start < DEFAULT_FROM ? DEFAULT_FROM : p.start;
  t.value = p.end;
}

/* When the user edits From / To by hand, the month select follows: matches a month or becomes "Custom range" */
function syncMonthFromInputs_() {
  var f = document.getElementById("from").value, t = document.getElementById("to").value;
  if (!f && !t) { state.month = "all"; return; }
  var keys = periodKeys_();
  for (var i = 0; i < keys.length; i++) {
    var p = periodRange_(keys[i]);
    var ps = p.start < DEFAULT_FROM ? DEFAULT_FROM : p.start;
    if (ps === f && p.end === t) { state.month = keys[i]; return; }
  }
  state.month = "custom";
}

function defaultMonth_() {
  return DEFAULT_MONTH === "current" ? periodKeyOf_(todayStr()) : "all";
}

/* ===== Weeks: Monday → Sunday splits of a date range =====
   Given a [from, to] range, returns weeks [{start, end, index}], Monday-start,
   clipped to the range boundaries (the first/last week can be shorter than 7 days). */
function addDays_(iso, n) {
  var p = String(iso).split("-");
  return isoOf_(new Date(+p[0], +p[1] - 1, +p[2] + n));
}

function splitWeeks_(from, to) {
  var weeks = [];
  if (!from || !to || from > to) return weeks;
  var cur = from, n = 1;
  while (cur <= to) {
    var p = String(cur).split("-");
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    var dow = d.getDay();                              /* 0=Sun..6=Sat */
    var diffToSunday = (dow === 0) ? 0 : (7 - dow);     /* days left to this week's Sunday */
    var sunday = addDays_(cur, diffToSunday);
    var wEnd = sunday < to ? sunday : to;
    weeks.push({ start: cur, end: wEnd, index: n });
    n++;
    cur = addDays_(wEnd, 1);
  }
  return weeks;
}

function weekLabel_(w) { return w.start + " → " + w.end; }

/* ===== JSONP ===== */
function jsonp(url, cb, onErr) {
  var name = "cb_" + Date.now() + Math.floor(Math.random() * 1e6);
  var s = document.createElement("script");
  var done = false;
  var timer = setTimeout(function () {
    if (!done) { cleanup(); onErr("The request took too long. Make sure the deployment is running and accessible to anyone."); }
  }, 40000);
  window[name] = function (d) { done = true; clearTimeout(timer); cleanup(); cb(d); };
  function cleanup() { try { delete window[name]; } catch (e) { window[name] = undefined; } s.remove(); }
  s.src = url + (url.indexOf("?") === -1 ? "?" : "&") + "callback=" + name + "&_=" + Date.now();
  s.onerror = function () {
    if (!done) { clearTimeout(timer); cleanup(); onErr("Can't reach the web app. Check the link and the deployment permissions."); }
  };
  document.body.appendChild(s);
}

/* ===== Today's date in local time (yyyy-mm-dd) ===== */
function todayStr() {
  var d = new Date();
  var local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return local.toISOString().slice(0, 10);
}

/* Day name from a yyyy-mm-dd date */
function dayName_(iso) {
  var p = String(iso || "").split("-");
  if (p.length !== 3) return "";
  var d = new Date(+p[0], +p[1] - 1, +p[2]);
  return isNaN(d) ? "" : DAY_NAMES[d.getDay()];
}

/* ===== Loading ===== */
/* We load all data from MIN_DATE, and date filtering happens in the browser.
   silent === true: quiet auto-refresh, no loading messages and the screen isn't cleared on failure */
function load(silent) {
  silent = (silent === true);
  var btn = document.getElementById("reload");
  if (!silent) {
    btn.disabled = true; btn.textContent = "Loading…";
    document.getElementById("out").innerHTML = '<div class="note">Loading data…</div>';
  }

  jsonp(API + "?action=data", function (res) {
    if (!silent) { btn.disabled = false; btn.textContent = "Refresh Data"; }
    if (!res || !res.ok) return fail((res && res.error) || "The web app returned an unrecognized response.");

    state.rows = res.rows || [];
    state.target = TARGET_HOURS;   /* fixed from the front-end so it's always 6.4 */

    if (res.minDate) {
      ["from", "to", "sdFrom", "sdTo"].forEach(function (id) {
        document.getElementById(id).min = res.minDate;
      });
    }

    var users = {};
    state.rows.forEach(function (r) { users[r.user] = 1; });
    document.getElementById("userlist").innerHTML =
      Object.keys(users).sort().map(function (u) { return '<option value="' + esc(u) + '">'; }).join("");

    /* Banner under the title — shows problems reading the names sheet AND/OR the attendance sheet,
       taken straight from res.meta (no need to open a separate debug link — just screenshot the dashboard) */
    var st = res.meta && res.meta.namesStatus;
    var at = res.meta && res.meta.attend;
    var parts = [];
    if (st && st.external && st.external !== "ok") parts.push("External names sheet unavailable (using fallback names)");
    else if (st && st.gidFallback) parts.push("Names tab (gid) not found, reading the first tab instead");
    if (at) {
      var reason = at.lastError ? (": " + at.lastError) : "";
      if (!at.okDays) {
        parts.push("Attendance unavailable" + reason +
          (at.budgetSkipped ? " · " + at.budgetSkipped + " day(s) skipped for speed" : ""));
      } else if (at.emptyDays && at.emptyDays.length) {
        parts.push("Attendance tab read but empty for: " + at.emptyDays.slice(0, 3).join(", "));
      }
    }
    document.getElementById("sub").textContent = parts.length ? ("⚠ " + parts.join(" · ⚠ ")) : "";

    document.getElementById("stamp").textContent =
      "Last updated: " + new Date(res.generatedAt).toLocaleString("en-US");

    if (!state.rows.length && state.view !== "submit") return noData();

    render();
  }, fail);

  function fail(msg) {
    if (silent) return;
    btn.disabled = false; btn.textContent = "Refresh Data";
    document.getElementById("out").innerHTML = '<div class="note error">' + esc(msg) + '</div>';
  }
}

/* Loaded once: the fixed roster member count per QC team (doesn't depend on any date range).
   Used by the QC tab's weekly cards so "Members" stays correct per week. */
function loadTeamMembersOnce_(cb) {
  if (state.teamMembers) { cb(); return; }
  jsonp(API + "?action=teams", function (res) {
    var m = {};
    if (res && res.ok) (res.teams || []).forEach(function (t) { m[t.tl] = t.members; });
    state.teamMembers = m;
    cb();
  }, function () { state.teamMembers = {}; cb(); });
}

/* ===== Submit: load saved data from the sheet ===== */
function loadSubmitData(cb) {
  jsonp(API + "?action=submitData", function (res) {
    if (!res || !res.ok) {
      document.getElementById("out").innerHTML =
        '<div class="note error">' + esc((res && res.error) || "Failed to load Submit data.") + '</div>';
      return;
    }
    state.submitRows = res.rows || [];
    state.submitSheetUrl = res.sheetUrl || "";
    cb();
  }, function (msg) {
    document.getElementById("out").innerHTML = '<div class="note error">' + esc(msg) + '</div>';
  });
}

function noData() {
  document.getElementById("stats").innerHTML = "";
  document.getElementById("out").innerHTML =
    '<div class="note">No records in this range.<br><br>' +
    'Data is only available from <code>' + esc(DEFAULT_FROM) + '</code> onward.<br>' +
    '<a href="' + API + '?action=debug" target="_blank" rel="noopener">Open the diagnostics page</a></div>';
}

/* ===== Filtering ===== */
function digits(s) { return String(s).replace(/\D+/g, ""); }

function matchUser(user, name, q) {
  if (!q) return true;
  var lower = q.toLowerCase();
  if (user.toLowerCase().indexOf(lower) > -1) return true;
  if (name && name.toLowerCase().indexOf(lower) > -1) return true;
  var qd = digits(q);
  if (qd && digits(user).indexOf(qd) > -1) return true;
  return false;
}

/* "All Users" tab filter: search + below target + from/to date */
function filtered(ignoreBad) {
  var q = document.getElementById("q").value.trim();
  var bad = !ignoreBad && document.getElementById("onlyBad").checked;
  var from = document.getElementById("from").value;
  var to = document.getElementById("to").value;
  return state.rows.filter(function (r) {
    if (from && r.date < from) return false;
    if (to && r.date > to) return false;
    if (!matchUser(r.user, r.name, q)) return false;
    if (bad && r.hours >= state.target) return false;
    return true;
  });
}

function groupUsers(rows) {
  var m = {};
  rows.forEach(function (r) {
    var u = m[r.user] || (m[r.user] = { user: r.user, name: r.name, team: r.team, rooms: {}, total: 0, sum: 0, missed: [] });
    u.rooms[r.room] = 1; u.total++; u.sum += r.hours;
    if (r.hours < state.target) u.missed.push(r);
  });
  return Object.keys(m).map(function (k) {
    var u = m[k];
    u.avg = u.total ? u.sum / u.total : 0;
    u.pct = u.total ? u.missed.length / u.total : 0;
    u.roomText = Object.keys(u.rooms).join(", ");
    u.missedCount = u.missed.length;
    u.missed.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    return u;
  });
}

/* ===== Rendering ===== */
function render() {
  if (state.view === "submit") { renderSubmitTab(); return; }
  if (!state.rows.length) return noData();
  if (state.view === "teams") { renderTeamsTab(); return; }
  if (state.view === "hours") { renderHoursTab(); return; }
  if (state.view === "single") { renderSingleDay(); return; }
  var rows = filtered();
  renderSingleStats_(usersStatsRange_(), true);   /* Cards use today's hours (like the Single Day tab), not the average of all days */
  renderUsers(rows);
}

/* Range for the "All Users" tab cards: empty fields = today (or the latest day with data) — same numbers as the Single Day tab.
   If you pick dates (or a month), the cards are computed over that range. */
function usersStatsRange_() {
  var f = document.getElementById("from").value;
  var t = document.getElementById("to").value;
  if (!f && !t) { var d = autoDay_(); return { from: d, to: d, auto: true }; }
  return { from: f || "0000-00-00", to: t || "9999-99-99", auto: false };
}

/* Small line under the cards clarifying which day/period the cards are computed on */
function statsCaption_(rg) {
  if (rg.auto || rg.from === rg.to) {
    var dn = dayName_(rg.from);
    return "Today: " + rg.from + (dn ? " — " + dn : "") + ((rg.auto && rg.from !== todayStr()) ? " · latest day with data" : "");
  }
  return "Period: from " + (rg.from === "0000-00-00" ? "the first day" : rg.from) + " to " + (rg.to === "9999-99-99" ? "the last day" : rg.to);
}

function stat(v, label, color) {
  return '<div class="stat" style="--c:' + color + '"><b>' + v + '</b><span>' + label + '</span></div>';
}

/* User: ID + domain laid out neatly (the ID is uppercased for consistency; the underlying data is unchanged) */
function uidCell(user) {
  var u = String(user == null ? "" : user);
  var at = u.indexOf("@");
  var id = at > -1 ? u.slice(0, at) : u;
  var dom = at > -1 ? u.slice(at) : "";
  return '<span class="uid"><span class="uid-id">' + esc(id) + '</span>' + (dom ? '<span class="uid-dom">' + esc(dom) + '</span>' : '') + '</span>';
}

function nameCell(name) {
  return name ? '<span class="name">' + esc(name) + '</span>' : '<span class="name empty">—</span>';
}

/* P attendance only (not PT and not empty) */
function isP_(att) { return String(att == null ? "" : att).trim().toUpperCase() === "P"; }

/* Attendance: P / PT (any other value is shown as-is) */
function attBadge(att) {
  var v = String(att == null ? "" : att).trim();
  if (!v) return '<span class="att att-none">—</span>';
  var u = v.toUpperCase();
  var cls = (u === "P") ? "att-p" : (u === "PT" ? "att-pt" : "att-other");
  return '<span class="att ' + cls + '">' + esc(v) + '</span>';
}

/* --- All Users: grouped by team like the roster (Buffer shows here as a team like the other rooms) ---
   The month selector sits on the right side of the first (top) team bar. */
function renderUsers(rows) {
  var list = groupUsers(rows);
  document.getElementById("count").textContent = list.length + " users shown";
  if (!list.length) return empty();

  var groups = {};
  list.forEach(function (u) {
    var key = u.team || "No known team";
    (groups[key] || (groups[key] = [])).push(u);
  });

  var orderedKeys = TEAM_ORDER.filter(function (k) { return groups[k]; })
    .concat(Object.keys(groups).filter(function (k) { return TEAM_ORDER.indexOf(k) === -1; }));

  var html = '<table><tbody>';
  var firstBar = true;
  orderedKeys.forEach(function (key) {
    var members = groups[key].sort(function (a, b) { return b.missedCount - a.missedCount; });
    var col = teamColor_(key);

    html += '<tr class="group-head" style="--c:' + col.c + '">' +
      '<td colspan="6"><div class="gh-flex"><span dir="ltr">' + esc(key) + ' (' + members.length + ' user)</span>' +
      (firstBar ? monthBoxHtml_() : '') + '</div></td></tr>';
    firstBar = false;

    html += '<tr style="background:#f7f8fc">' +
      '<th style="position:static">Name</th><th style="position:static">User</th><th style="position:static">Room</th>' +
      '<th style="position:static">Days Recorded</th><th style="position:static">Missing Days</th>' +
      '<th style="position:static">Details</th></tr>';

    members.forEach(function (u) {
      html += '<tr>' +
        '<td>' + nameCell(u.name) + '</td>' +
        '<td>' + uidCell(u.user) + '</td>' +
        '<td>' + esc(u.roomText) + '</td>' +
        '<td class="num"><span class="cnt ok">' + u.total + '</span></td>' +
        '<td class="num"><span class="cnt bad">' + u.missedCount + '</span></td>' +
        '<td><button class="toggle" data-u="' + esc(u.user) + '">Details</button></td>' +
        '</tr>';
    });
  });

  document.getElementById("out").innerHTML =
    '<div class="scroll-hint">⟵ مرر يمين وشمال لعرض باقي الأعمدة</div>' + html + '</tbody></table>';
  Array.prototype.forEach.call(document.querySelectorAll(".toggle"), function (b) {
    b.onclick = function () {
      openDetailsModal_(b.getAttribute("data-u"), document.getElementById("from").value, document.getElementById("to").value);
    };
  });
}

/* ===== Details modal (Details: name) =====
   Shows ALL days (green = met target, red = below target).
   The small "Below target" box filters to the days below target only; unchecked = everything.
   It also has its own month selector (26th → 25th). */
var DAY_NAMES_EN = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function dayNameEn_(iso) {
  var p = String(iso || "").split("-");
  if (p.length !== 3) return "";
  var d = new Date(+p[0], +p[1] - 1, +p[2]);
  return isNaN(d) ? "" : DAY_NAMES_EN[d.getDay()];
}

function mTile_(label, html, cls, wide, mwide) {
  return '<div class="m-tile' + (wide ? ' wide' : '') + (mwide ? ' mwide' : '') + '"><div class="m-label">' + esc(label) + '</div>' +
    '<div class="m-value' + (cls ? ' ' + cls : '') + '">' + html + '</div></div>';
}

/* Attendance rank: P first, then PT, then anything else/empty */
function attRank_(a) {
  var u = String(a == null ? "" : a).trim().toUpperCase();
  return u === "P" ? 0 : (u === "PT" ? 1 : 2);
}

/* clsOf: fixed "ok" / "bad", or a function returning the class per day */
function mCards_(arr, clsOf) {
  if (!arr.length) return '<span class="days-none">None</span>';
  return '<div class="days-grid">' + arr.map(function (m) {
    var a = String(m.att == null ? "" : m.att).trim();
    var cls = (typeof clsOf === "function") ? clsOf(m) : clsOf;
    /* No attendance = the user didn't show up: the card is light gray and shows a dash instead of P/PT */
    return '<div class="day-card' + (a ? '' : ' noatt') + '">' +
      '<div class="day-date"><b>' + esc(m.date) + '</b><small>' + esc(dayNameEn_(m.date)) + '</small></div>' +
      (a ? attBadge(a) : '<span class="att att-dash">-</span>') +
      '<span class="day-hours ' + cls + '">' + m.hours.toFixed(2) + '</span></div>';
  }).join("") + '</div>';
}

/* from / to are optional (empty = all days). The modal keeps its own month state, independent from the page. */
function openDetailsModal_(user, from, to) {
  var hasUser = state.rows.some(function (r) { return r.user === user; });
  if (!hasUser) return;

  /* All Users tab: start on the month selected on the page. Other tabs (Single Day period): start on that exact range. */
  var mk = (state.view === "users") ? state.month : "custom";
  if (mk === "all") { from = ""; to = ""; }
  else if (mk !== "custom") { var p = periodRange_(mk); from = p.start; to = p.end; }
  else if (!from && !to) mk = "all";

  modalState = { user: user, month: mk, from: from || "", to: to || "", below: false };
  renderModal_();

  var m = document.getElementById("modal");
  m.hidden = false;
  document.body.style.overflow = "hidden";
  m.querySelector(".modal-card").scrollTop = 0;
}

function setModalMonth_(k) {
  if (!modalState) return;
  modalState.month = k;
  if (k === "all") { modalState.from = ""; modalState.to = ""; }
  else if (k !== "custom") { var p = periodRange_(k); modalState.from = p.start; modalState.to = p.end; }
  renderModal_();
}

function renderModal_() {
  var ms = modalState;
  if (!ms) return;
  var T = state.target;

  var all = state.rows.filter(function (r) { return r.user === ms.user; })
    .sort(function (a, b) { return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
  if (!all.length) return;

  var recs = all.filter(function (r) {
    return (!ms.from || r.date >= ms.from) && (!ms.to || r.date <= ms.to);
  });

  var last = all[all.length - 1];
  var rooms = {};
  (recs.length ? recs : all).forEach(function (r) { rooms[r.room] = 1; });
  var name = last.name || "";

  var met = recs.filter(function (r) { return r.hours >= T; }).length;
  var missedN = recs.length - met;

  var list;
  if (ms.below) {
    /* below target only: P first, then PT, then the rest (by date) */
    list = recs.filter(function (r) { return r.hours < T; }).sort(function (a, b) {
      return attRank_(a.att) - attRank_(b.att) || (a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
    });
  } else {
    list = recs;   /* everything, in date order */
  }

  /* Weekly blocks (Monday → Sunday): black bar, the week's day cards, then the weekly average box.
     Average % = average hours / target. 80%+ green | 70–79% yellow (Deduction -100) | under 70% red (Deduction -200) */
  var weeksHtml = "";
  if (recs.length) {
    var weeks = splitWeeks_(recs[0].date, recs[recs.length - 1].date);
    weeks.forEach(function (w) {
      var wr = recs.filter(function (r) { return r.date >= w.start && r.date <= w.end; });
      if (!wr.length) return;
      var sum = 0;
      wr.forEach(function (r) { sum += r.hours; });
      var avg = sum / wr.length;
      var pct = Math.round(avg / T * 100);
      var lvl = pct >= 80 ? "good" : (pct >= 70 ? "warn" : "bad");
      var ded = lvl === "warn" ? "Deduction -100" : (lvl === "bad" ? "Deduction -200" : "");

      var shown = ms.below
        ? wr.filter(function (r) { return r.hours < T; }).sort(function (a, b) {
            return attRank_(a.att) - attRank_(b.att) || (a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
          })
        : wr;
      var wcards = shown.length
        ? mCards_(shown, function (m) { return m.hours >= T ? "ok" : "bad"; })
        : '<span class="days-none">No days below target this week ✅</span>';

      weeksHtml += '<div class="wk-bar"><b>Week ' + w.index + '</b><span>from ' + esc(w.start) + ' to ' + esc(w.end) + '</span></div>' +
        wcards +
        '<div class="wk-sum"><span class="wk-lbl">Weekly average</span>' +
        '<span class="wk-avg ' + lvl + '">' + avg.toFixed(2) + '</span>' +
        '<span class="wk-pct">' + pct + '%</span>' +
        (ded ? '<span class="wk-ded ' + lvl + '">' + ded + '</span>' : '') + '</div>';
    });
  }
  var cards = weeksHtml || ('<span class="days-none">' + (ms.below
      ? "No days below target in this period ✅"
      : "No records in this period.") + '</span>');

  var daysTile = '<div class="m-tile wide">' +
    '<div class="m-label m-label-row"><span>' + (ms.below ? "Below target days" : "All days") + ' (' + list.length + ')</span>' +
    '<label class="m-check"><input type="checkbox" id="mBelow"' + (ms.below ? " checked" : "") + '> Below target</label></div>' +
    '<div class="m-value">' + cards + '</div></div>';

  var customText = (ms.from || "…") + " → " + (ms.to || "…");
  var monthBar = '<div class="m-monthbar"><b>Month</b>' +
    '<select id="mMonth" class="m-sel" aria-label="Month">' + monthOptionsHtml_(ms.month, customText) + '</select>' +
    '<span class="mrange">' + esc(monthRangeText_(ms.month, ms.from, ms.to)) + '</span></div>';

  document.getElementById("modalTitle").textContent = "Details: " + (name || ms.user);
  document.getElementById("modalBody").innerHTML = monthBar +
    '<div class="modal-grid">' +
      mTile_("Name", name ? esc(name) : "—", "", false, true) +
      mTile_("User", esc(ms.user), "", false, true) +
      mTile_("Team (QC)", esc(last.team || "—")) +
      mTile_("Room", esc(Object.keys(rooms).join(", "))) +
    '</div>' +
    '<div class="modal-grid g3">' +
      mTile_("Days recorded", String(recs.length), "blue") +
      mTile_("Met target", String(met), "good") +
      mTile_("Below target", String(missedN), "bad") +
    '</div>' +
    '<div class="modal-grid mt">' + daysTile + '</div>';
}

function closeDetailsModal_() {
  document.getElementById("modal").hidden = true;
  document.body.style.overflow = "";
  modalState = null;
}

/* --- Single Day: opens on today automatically; for a period pick a from/to day (Buffer team excluded) --- */
function latestDate_() {
  var m = "";
  state.rows.forEach(function (r) { if (r.team !== "Buffer" && r.date > m) m = r.date; });
  return m;
}

/* The automatic day: today if it has records, otherwise the latest day with data (no message, no click needed) */
function autoDay_() {
  var t = todayStr();
  var hasToday = state.rows.some(function (r) { return r.team !== "Buffer" && r.date === t; });
  if (hasToday) return t;
  return latestDate_() || t;
}

/* Both fields empty = the automatic day. One date only = that day. Both = a period */
function singleRange_() {
  var f = document.getElementById("sdFrom").value;
  var t = document.getElementById("sdTo").value;
  var auto = (!f && !t);
  if (auto) { f = t = autoDay_(); }
  if (!f) f = t;
  if (!t) t = f;
  if (f > t) { var x = f; f = t; t = x; }
  return { from: f, to: t, auto: auto };
}

/* Total number of named users on the roster (excluding Buffer) — fixed across all days */
function rosterTotal_() {
  var m = {};
  state.rows.forEach(function (r) { if (r.team !== "Buffer") m[r.user] = 1; });
  return Object.keys(m).length;
}

/* Single Day tab cards: the total is fixed, met/not-met change with the day or period.
   A user with no record on the day/period counts as "not met". The cards aren't affected by search. */
/* "User not met" = number of users who have a record in the range and whose hours are below target
   (exactly like the "below target" total on the team cards). A user with no record at all in the
   range isn't counted in either bucket. */
function renderSingleStats_(rg, withCaption) {
  var by = {};
  state.rows.forEach(function (r) {
    if (r.team === "Buffer" || r.date < rg.from || r.date > rg.to) return;
    var u = by[r.user] || (by[r.user] = { sum: 0, n: 0 });
    u.sum += r.hours; u.n++;
  });
  var ok = 0, bad = 0;
  Object.keys(by).forEach(function (k) {
    if (by[k].sum / by[k].n >= state.target) ok++; else bad++;
  });
  var total = rosterTotal_();
  document.getElementById("stats").innerHTML =
    stat(total, "Users", "#2b4b8f") +
    stat(ok, "Users meeting target", "#0f9d58") +
    stat(bad, "Users below target", "#dc2626") +
    (withCaption ? '<div class="stats-cap">' + esc(statsCaption_(rg)) + '</div>' : '');
}

function renderSingleDay() {
  var rg = singleRange_();
  renderSingleStats_(rg);
  var isRange = rg.from !== rg.to;
  var label = isRange ? ("from " + rg.from + " to " + rg.to) : rg.from;
  var T = state.target;
  var q = document.getElementById("q").value.trim();
  var onlyBad = document.getElementById("onlyBad").checked || state.captureBad;

  var base = state.rows.filter(function (r) {
    return r.date >= rg.from && r.date <= rg.to && r.team !== "Buffer" && matchUser(r.user, r.name, q);
  });
  /* Below-target image: for a period we only count days with P attendance (for a single day, filtering happens below and team stats stay complete) */
  if (state.captureBad && isRange) base = base.filter(function (r) { return isP_(r.att); });

  if (!base.length) {
    document.getElementById("count").textContent = "";
    document.getElementById("out").innerHTML =
      '<div class="note">No records ' + (isRange ? "in this period" : "for " + esc(rg.from)) + '.</div>';
    return;
  }

  /* entries: one row per record (single day) — or one row per user with their average hours (period), with day details */
  var entries = [];
  if (!isRange) {
    base.forEach(function (r) {
      entries.push({ user: r.user, name: r.name, team: r.team || "", hours: r.hours, att: r.att, days: 1, missed: r.hours < T ? 1 : 0 });
    });
  } else {
    var by = {};
    base.forEach(function (r) {
      var u = by[r.user] || (by[r.user] = { user: r.user, name: r.name, team: r.team || "", sum: 0, days: 0, missed: 0, recs: [] });
      u.sum += r.hours; u.days++;
      if (r.hours < T) u.missed++;
      if (!u.name && r.name) u.name = r.name;
      u.recs.push({ date: r.date, hours: r.hours, att: r.att });
    });
    Object.keys(by).forEach(function (k) {
      var u = by[k];
      entries.push({ user: u.user, name: u.name, team: u.team, hours: u.sum / u.days, att: "", days: u.days, missed: u.missed, recs: u.recs });
    });
  }

  var groups = {};
  entries.forEach(function (e) {
    var key = e.team || "No known team";
    (groups[key] || (groups[key] = [])).push(e);
  });
  var orderedKeys = TEAM_ORDER.filter(function (k) { return groups[k]; })
    .concat(Object.keys(groups).filter(function (k) { return TEAM_ORDER.indexOf(k) === -1; }));

  var head = isRange
    ? '<th>Average Hours</th><th>Days Recorded</th><th>Missing Days</th><th>Details</th>'
    : '<th>Hours</th><th>Attendance</th>';

  var html = '<div class="single-day-wrap"><table class="single-day-table"><thead><tr>' +
    head + '<th>Name</th><th>User</th><th>Team (QC)</th>' +
    '</tr></thead><tbody>';

  var shownCount = 0, shownUsers = {};

  orderedKeys.forEach(function (key) {
    var all = groups[key];
    var shown = onlyBad
      ? all.filter(function (e) { return e.hours < T && (!state.captureBad || isRange || isP_(e.att)); })
      : all;
    if (!shown.length) return;
    shown = shown.slice().sort(function (a, b) { return a.hours - b.hours; });

    var col = teamColor_(key);
    var below = all.filter(function (e) { return e.hours < T; }).length;
    var uniq = {};
    all.forEach(function (e) { uniq[e.user] = 1; });
    var usersN = Object.keys(uniq).length;

    shown.forEach(function (e, i) {
      var bad = e.hours < T;
      shownCount++; shownUsers[e.user] = 1;
      html += '<tr>' +
        '<td><span class="sd-hours ' + (bad ? "bad" : "ok") + '">' + e.hours.toFixed(2) + '</span></td>';
      if (isRange) {
        html += '<td><span class="sd-count plain">' + e.days + '</span></td>' +
          '<td><span class="sd-count ' + (e.missed ? "bad" : "ok") + '">' + e.missed + '</span></td>' +
          '<td>' + (state.captureBad
            ? '<span style="color:var(--muted)">—</span>'
            : '<button class="sd-toggle" data-u="' + esc(e.user) + '">' + "Details" + '</button>') + '</td>';
      } else {
        html += '<td>' + attBadge(e.att) + '</td>';
      }
      html += '<td><span class="sd-box sd-name' + (e.name ? "" : " empty") + '">' + (e.name ? esc(e.name) : "No name") + '</span></td>' +
        '<td>' + uidCell(e.user) + '</td>';
      if (i === 0) {
        html += '<td class="sd-team-cell" rowspan="' + shown.length + '" style="--team-c1:' + col.c + '">' +
          '<span class="sd-team-box">' + esc(key) +
          '<span class="tsub">' + usersN + ' users · ' + below + ' below target</span></span></td>';
      }
      html += '</tr>';
    });
  });

  html += '</tbody></table></div>';

  if (!shownCount) {
    document.getElementById("count").textContent = "";
    document.getElementById("out").innerHTML =
      '<div class="note">All users met the target ' + (isRange ? "for this period" : "for this day") + ' ✅</div>';
    return;
  }

  document.getElementById("count").textContent =
    Object.keys(shownUsers).length + " users · " + label + (isRange ? " (average hours per user)" : "");

  /* A line clarifying which day/period is shown (since the fields are empty) — turns into a "below target" banner while preparing the image */
  var top;
  if (state.captureBad) {
    top = '<div class="capture-banner">Users who did not meet the target (' + T + ' hours) · P attendance only · ' + esc(label) + '</div>';
  } else {
    var dn = dayName_(rg.from);
    var infoText = isRange
      ? "Period: from " + rg.from + " to " + rg.to
      : "Today: " + rg.from + (dn ? " — " + dn : "") + ((rg.auto && rg.from !== todayStr()) ? " · latest day with data" : "");
    top = '<div class="sd-info">' + esc(infoText) + '</div>';
  }

  document.getElementById("out").innerHTML =
    top + '<div class="scroll-hint">⟵ مرر يمين وشمال لعرض باقي الأعمدة</div>' + html;

  Array.prototype.forEach.call(document.querySelectorAll(".sd-toggle"), function (b) {
    b.onclick = function () {
      openDetailsModal_(b.getAttribute("data-u"), rg.from, rg.to);
    };
  });
}

/* --- QC tab: weekly breakdown ---
   When a specific month (or a custom range) is selected, the month is split into
   Monday→Sunday weeks and each week gets its own row of team cards computed from
   that week's records only. "All months" shows one overall set of cards (too many
   weeks otherwise). Member counts come from the fixed roster (loaded once). */
function teamStatsForRange_(team, from, to) {
  var sum = 0, n = 0, below = 0;
  state.rows.forEach(function (r) {
    if (r.team !== team || r.date < from || r.date > to) return;
    sum += r.hours; n++;
    if (r.hours < state.target) below++;
  });
  return { avgHours: n ? sum / n : 0, total: n, achievedPct: n ? (n - below) / n : 1 };
}

function teamCardHtml_(team, s) {
  var achievedPct = Math.round(s.achievedPct * 100);
  var col = teamColor_(team);
  var members = (state.teamMembers && state.teamMembers[team] != null) ? state.teamMembers[team] : "–";
  return '<div class="tcard" style="--c:' + col.c + '">' +
    '<h3>' + esc(team) + '</h3>' +
    '<div class="big">' + s.avgHours.toFixed(2) + '<small>hrs/day</small></div>' +
    '<div class="row2">' +
      '<span>Members<b>' + members + '</b></span>' +
      '<span>Hours achieved<b class="' + (achievedPct >= 70 ? "good" : "bad") + '">' + achievedPct + '%</b></span>' +
    '</div></div>';
}

function renderTeamsTab() {
  document.getElementById("stats").innerHTML = "";

  if (!state.teamMembers) {
    document.getElementById("out").innerHTML = monthBarHtml_() + '<div class="note">Loading team data…</div>';
    loadTeamMembersOnce_(renderTeamsTab);
    return;
  }

  var teams = TEAM_ORDER.filter(function (k) { return k !== "Buffer"; });
  document.getElementById("count").textContent = teams.length + " teams";

  var f = document.getElementById("from").value, t = document.getElementById("to").value;
  var html = monthBarHtml_();

  if (!f || !t) {
    /* "All months": one overall set of cards over whatever data exists */
    var lo = "0000-00-00", hi = "9999-99-99";
    html += '<div class="teamcard">';
    teams.forEach(function (team) { html += teamCardHtml_(team, teamStatsForRange_(team, lo, hi)); });
    html += '</div>';
  } else {
    var weeks = splitWeeks_(f, t);
    if (!weeks.length) {
      html += '<div class="note">No valid date range selected.</div>';
    }
    weeks.forEach(function (w) {
      html += '<div class="week-bar"><b>Week ' + w.index + '</b><span class="mrange">from ' + esc(w.start) + ' to ' + esc(w.end) + '</span></div>' +
        '<div class="teamcard">';
      teams.forEach(function (team) { html += teamCardHtml_(team, teamStatsForRange_(team, w.start, w.end)); });
      html += '</div>';
    });
  }

  document.getElementById("out").innerHTML = html;
}

/* --- Team Hours: pick a QC + a week within the selected month → a table with every member's
   daily hours for that week only (one column per day, 7 days max), plus a Total column. --- */

/* Weeks available to pick from, based on the page's current From/To (month selector or custom dates).
   "All months" / no dates → falls back to the last 7 days that actually have data. */
function hoursWeeks_() {
  var f = document.getElementById("from").value;
  var t = document.getElementById("to").value;
  if (!f || !t) {
    var latest = "";
    state.rows.forEach(function (r) { if (r.date > latest) latest = r.date; });
    latest = latest || todayStr();
    t = latest; f = addDays_(latest, -6);
  }
  if (f < DEFAULT_FROM) f = DEFAULT_FROM;
  if (f > t) { var x = f; f = t; t = x; }
  return splitWeeks_(f, t);
}

/* Picks the week to show by default: the one containing today, else the most recent week in the list */
function defaultWeekStart_(weeks) {
  if (!weeks.length) return "";
  var t = todayStr();
  for (var i = 0; i < weeks.length; i++) {
    if (t >= weeks[i].start && t <= weeks[i].end) return weeks[i].start;
  }
  return weeks[weeks.length - 1].start;
}

function renderHoursTab() {
  document.getElementById("stats").innerHTML = "";
  var T = state.target;
  var f0 = document.getElementById("from").value, t0 = document.getElementById("to").value;

  var teamOpts = '<option value="">Select QC…</option>' + TEAM_ORDER.map(function (t) {
    return '<option value="' + esc(t) + '"' + (t === state.thTeam ? " selected" : "") + '>' + esc(t) + '</option>';
  }).join("");

  var weeks = hoursWeeks_();
  if (!weeks.some(function (w) { return w.start === state.thWeek; })) {
    state.thWeek = defaultWeekStart_(weeks);
  }
  var weekOpts = weeks.map(function (w) {
    return '<option value="' + w.start + '"' + (w.start === state.thWeek ? " selected" : "") + '>' +
      'Week ' + w.index + ' (' + w.start + ' → ' + w.end + ')</option>';
  }).join("");

  var bar = '<div class="month-bar"><b>QC</b><select class="m-sel th-sel" aria-label="QC">' + teamOpts + '</select>' +
    '<b>Month</b><select class="month-sel" aria-label="Month">' + monthOptionsHtml_(state.month, (f0 || "…") + " → " + (t0 || "…")) + '</select>' +
    '<b>Week</b><select class="m-sel th-week-sel" aria-label="Week">' + weekOpts + '</select></div>';

  if (!state.thTeam) {
    document.getElementById("count").textContent = "";
    document.getElementById("out").innerHTML = bar +
      '<div class="note">Select a QC to see the team\'s hours day by day.</div>';
    return;
  }

  var selWeek = weeks.filter(function (w) { return w.start === state.thWeek; })[0] || weeks[weeks.length - 1];
  if (!selWeek) {
    document.getElementById("out").innerHTML = bar + '<div class="note">No valid week in range.</div>';
    return;
  }
  var rg = { from: selWeek.start, to: selWeek.end };
  state.thRangeFrom = rg.from; state.thRangeTo = rg.to;

  var team = state.thTeam;
  var days = [];
  for (var d = rg.from; d <= rg.to; d = addDays_(d, 1)) days.push(d);

  /* members = everyone on this team; hours per day inside this week only */
  var by = {};
  state.rows.forEach(function (r) {
    if (r.team !== team) return;
    var u = by[r.user] || (by[r.user] = { user: r.user, name: "", map: {}, sum: 0 });
    if (r.name) u.name = r.name;
    if (r.date >= rg.from && r.date <= rg.to) {
      u.map[r.date] = (u.map[r.date] || 0) + r.hours;
      u.sum += r.hours;
    }
  });

  var q = document.getElementById("q").value.trim();
  var members = Object.keys(by).map(function (k) { return by[k]; })
    .filter(function (u) { return matchUser(u.user, u.name, q); })
    .sort(function (a, b) {
      var an = (a.name || a.user).toLowerCase(), bn = (b.name || b.user).toLowerCase();
      return an < bn ? -1 : (an > bn ? 1 : 0);
    });

  document.getElementById("count").textContent = members.length + " users · " + team + " · Week " + selWeek.index;

  if (!members.length) {
    document.getElementById("out").innerHTML = bar + '<div class="note">No users found for this team.</div>';
    return;
  }

  var info = "Team: " + team + " · Week " + selWeek.index + " · " + rg.from + " → " + rg.to;

  var html = bar + '<div class="sd-info" style="margin-top:12px">' + esc(info) + '</div>' +
    '<div class="scroll-hint">⟵ مرر يمين وشمال لعرض باقي الأعمدة</div>' +
    '<div class="th-wrap"><table class="hours-table"><thead><tr>' +
    '<th class="col-name">Name</th><th class="col-user">User</th>';
  days.forEach(function (d) { html += '<th title="' + esc(d) + '">' + esc(dayNameEn_(d).slice(0, 3)) + ' ' + esc(d.slice(5)) + '</th>'; });
  html += '<th class="htotal">Total</th></tr></thead><tbody>';

  var dayTot = {}, grand = 0;
  members.forEach(function (u) {
    html += '<tr><td class="col-name">' + nameCell(u.name) + '</td><td class="col-user">' + uidCell(u.user) + '</td>';
    days.forEach(function (d) {
      var v = u.map[d];
      if (v === undefined) { html += '<td class="hv none">-</td>'; return; }
      dayTot[d] = (dayTot[d] || 0) + v;
      html += '<td class="hv' + (v < T ? " bad" : "") + '">' + v.toFixed(2) + '</td>';
    });
    grand += u.sum;
    html += '<td class="htotal">' + u.sum.toFixed(2) + '</td></tr>';
  });

  html += '</tbody><tfoot><tr><td class="col-name" colspan="2" style="text-align:left">Team total</td>';
  days.forEach(function (d) { html += '<td>' + (dayTot[d] !== undefined ? dayTot[d].toFixed(2) : "-") + '</td>'; });
  html += '<td>' + grand.toFixed(2) + '</td></tr></tfoot></table></div>';

  document.getElementById("out").innerHTML = html;
}

function empty() {
  /* Keep the month select visible so you can switch to another month when this one has no results */
  var bar = (state.view === "users" || state.view === "teams") ? monthBarHtml_() : "";
  document.getElementById("out").innerHTML = bar +
    '<div class="note">No results for these filters. Clear the filters or pick another month.</div>';
}

/* --- Submit: table (Team | FP | QA | Total) — daily entry + totals for any range --- */
function sumSubmit_(team, from, to) {
  var fp = 0, qa = 0;
  state.submitRows.forEach(function (r) {
    if (r.team !== team) return;
    if (r.date < from || r.date > to) return;
    fp += r.fp; qa += r.qa;
  });
  return { fp: fp, qa: qa, total: fp + qa };
}

function submitInput_(team, field) {
  var el = document.querySelector('input[data-team="' + team + '"][data-field="' + field + '"]');
  var n = (el && el.value !== "") ? Number(el.value) : 0;
  return (isFinite(n) && n > 0) ? Math.round(n) : 0;
}

/* Recomputes each team's total and the overall column totals live as you type */
function recalcSubmit_() {
  var sumFp = 0, sumQa = 0;
  SUBMIT_TEAMS.forEach(function (team, i) {
    var fp = submitInput_(team, "fp"), qa = submitInput_(team, "qa");
    sumFp += fp; sumQa += qa;
    var cell = document.getElementById("sTot" + i);
    if (cell) cell.textContent = fp + qa;
  });
  document.getElementById("sSumFp").textContent = sumFp;
  document.getElementById("sSumQa").textContent = sumQa;
  document.getElementById("sSumAll").textContent = sumFp + sumQa;
}

function renderSubmitTab() {
  document.getElementById("stats").innerHTML = "";
  document.getElementById("count").textContent = "";

  if (state.submitRows === null) {
    document.getElementById("out").innerHTML = '<div class="note">Loading Submit data…</div>';
    loadSubmitData(renderSubmitTab);
    return;
  }

  /* Both fields empty = today. One date only = that day. Both = a period */
  var from = state.submitFrom || "", to = state.submitTo || "";
  if (!from && !to) { from = to = todayStr(); }
  if (!from) from = to;
  if (!to) to = from;
  if (from > to) { var swp = from; from = to; to = swp; }
  var isSingleDay = (from === to);

  var html = '<div class="submit-toolbar">' +
    '<div class="field"><label for="subFrom">From date</label><input type="date" id="subFrom" value="' + esc(state.submitFrom || "") + '"></div>' +
    '<div class="field"><label for="subTo">To date</label><input type="date" id="subTo" value="' + esc(state.submitTo || "") + '"></div>' +
    '<button id="subRefresh">Refresh</button>' +
    (state.submitSheetUrl ? '<a class="submit-link" href="' + esc(state.submitSheetUrl) + '" target="_blank" rel="noopener">Open the Submit sheet</a>' : '') +
    '</div>';

  html += '<div class="scroll-hint">⟵ مرر يمين وشمال لعرض باقي الأعمدة</div>' +
    '<div class="submit-body"><table class="submit-table" dir="ltr"><thead><tr>' +
    '<th>Team Lead / QC</th><th>FP</th><th>QA</th><th>Total</th></tr></thead><tbody>';

  var gFp = 0, gQa = 0;
  SUBMIT_TEAMS.forEach(function (team, i) {
    var s = sumSubmit_(team, from, to);
    gFp += s.fp; gQa += s.qa;
    var col = teamColor_(team);

    html += '<tr><td class="s-name-cell" style="background:' + col.c + '">' + esc(SUBMIT_LABELS[team] || team) + '</td>';
    if (isSingleDay) {
      html += '<td><input type="number" min="0" step="1" class="submit-input" data-team="' + esc(team) +
        '" data-field="fp" value="' + (s.fp || "") + '" placeholder="0"></td>' +
        '<td><input type="number" min="0" step="1" class="submit-input" data-team="' + esc(team) +
        '" data-field="qa" value="' + (s.qa || "") + '" placeholder="0"></td>';
    } else {
      html += '<td class="s-val">' + s.fp + '</td><td class="s-val">' + s.qa + '</td>';
    }
    html += '<td class="s-total" id="sTot' + i + '">' + s.total + '</td></tr>';
  });

  html += '</tbody><tfoot><tr><td>Total</td>' +
    '<td id="sSumFp">' + gFp + '</td><td id="sSumQa">' + gQa + '</td><td id="sSumAll">' + (gFp + gQa) + '</td>' +
    '</tr></tfoot></table></div>';

  if (isSingleDay) {
    html += '<div class="submit-savebar"><button id="subSave" class="primary">Save Submit numbers</button>' +
      '<span class="submit-saved-note' + (state.submitSavedWarn ? ' warn' : '') + '">' + esc(state.submitSavedNote || "") + '</span></div>';
  }

  document.getElementById("out").innerHTML = html;

  document.getElementById("subFrom").onchange = function () {
    state.submitFrom = this.value || "";
    state.submitSavedNote = "";
    render();
  };
  document.getElementById("subTo").onchange = function () {
    state.submitTo = this.value || "";
    state.submitSavedNote = "";
    render();
  };
  document.getElementById("subRefresh").onclick = function () {
    state.submitRows = null; state.submitSavedNote = "";
    render();
  };

  Array.prototype.forEach.call(document.querySelectorAll(".submit-input"), function (el) {
    el.addEventListener("input", recalcSubmit_);
  });

  var saveBtn = document.getElementById("subSave");
  if (saveBtn) saveBtn.onclick = function () { saveSubmitData(from); };
}

function saveSubmitData(date) {
  var btn = document.getElementById("subSave");
  btn.disabled = true; btn.textContent = "Saving…";

  var items = SUBMIT_TEAMS.map(function (team) {
    return { team: team, fp: submitInput_(team, "fp"), qa: submitInput_(team, "qa") };
  });

  var qs = "?action=submitSave&date=" + encodeURIComponent(date) + "&data=" + encodeURIComponent(JSON.stringify(items));

  jsonp(API + qs, function (res) {
    if (!res || !res.ok) {
      alert((res && res.error) || "Failed to save data.");
      btn.disabled = false; btn.textContent = "Save Submit numbers";
      return;
    }
    state.submitRows = null;
    var savedAt = new Date().toLocaleTimeString("en-US");
    state.submitSavedWarn = false;
    if (typeof res.saved !== "number") {
      /* This response is coming from an older backend version — new names are ignored silently */
      state.submitSavedWarn = true;
      state.submitSavedNote = "⚠ The web app is still on an old version of Code.gs — deploy a New version and try again";
    } else if (res.skipped && res.skipped.length) {
      state.submitSavedWarn = true;
      state.submitSavedNote = "⚠ Saved " + savedAt + " except: " + res.skipped.join(", ");
    } else {
      state.submitSavedNote = "Saved ✓ " + savedAt;
    }
    loadSubmitData(function () { render(); });
  }, function (msg) {
    alert(msg);
    btn.disabled = false; btn.textContent = "Save Submit numbers";
  });
}

/* ===== Download image =====
   Regardless of which tab you're on, downloading the image always switches to the "Single Day" tab
   for the latest day that has data (the same day the Single Day tab opens on), shows the users
   who didn't meet the target with P attendance only, then restores the page as it was.
   The capture is always rendered at a fixed desktop width, so on a phone the image still
   contains every column (Hours, Attendance, Name, User, Team). */
function yesterdayStr_() {
  var d = new Date();
  d.setDate(d.getDate() - 1);
  var local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return local.toISOString().slice(0, 10);
}

/* Team Hours tab: the button downloads an image of the hours table only (the selected week).
   The table is cloned into an off-screen box so the whole width is captured even when it scrolls sideways. */
function downloadHoursImage_() {
  var btn = document.getElementById("img");
  var tbl = document.querySelector("#out .hours-table");
  if (!tbl) { alert("Select a QC first, then download the table image."); return; }

  var fileName = "sf-team-hours-" + String(state.thTeam).replace(/\s+/g, "-") + "-" +
    state.thRangeFrom + "_to_" + state.thRangeTo + ".png";

  state.capturing = true;
  btn.disabled = true; btn.textContent = "Preparing image…";

  var holder = document.createElement("div");
  holder.id = "hoursCap";
  holder.style.cssText = "position:fixed;left:-20000px;top:0;padding:12px;background:#ffffff;width:max-content;";
  var clone = tbl.cloneNode(true);
  clone.style.width = "auto";
  Array.prototype.forEach.call(clone.querySelectorAll(".col-name"), function (el) { el.style.position = "static"; });
  holder.appendChild(clone);
  document.body.appendChild(holder);

  function finish() {
    if (holder.parentNode) holder.parentNode.removeChild(holder);
    state.capturing = false;
    btn.disabled = false; btn.textContent = "Download Table Image";
  }

  html2canvas(holder, {
    backgroundColor: "#ffffff",
    scale: window.innerWidth < 700 ? 1.5 : 2,
    useCORS: true,
    windowWidth: Math.max(holder.scrollWidth + 60, 1200),
    onclone: function (doc) {
      var h = doc.getElementById("hoursCap");
      if (h) { h.style.left = "0"; h.style.top = "0"; h.style.position = "absolute"; }
    }
  }).then(function (canvas) {
    canvas.toBlob(function (blob) {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = fileName;
      a.click();
      URL.revokeObjectURL(a.href);
      finish();
    });
  }).catch(function () {
    finish();
    alert("Failed to create the image. Try again.");
  });
}

function downloadImage() {
  /* On the Team Hours tab the button only downloads the hours table */
  if (state.view === "hours") { downloadHoursImage_(); return; }

  var btn = document.getElementById("img");

  /* Current page state, so we can restore it after capturing */
  var prev = {
    view: state.view,
    sdFrom: document.getElementById("sdFrom").value,
    sdTo: document.getElementById("sdTo").value,
    q: document.getElementById("q").value,
    onlyBad: document.getElementById("onlyBad").checked
  };

  function restore() {
    setView(prev.view);
    document.getElementById("sdFrom").value = prev.sdFrom;
    document.getElementById("sdTo").value = prev.sdTo;
    document.getElementById("q").value = prev.q;
    document.getElementById("onlyBad").checked = prev.onlyBad;
    state.captureBad = false;
    render();
  }

  function finish() {
    state.capturing = false;
    restore();
    btn.disabled = false; btn.textContent = "Download Image";
  }

  state.capturing = true;
  btn.disabled = true; btn.textContent = "Preparing image…";

  /* Latest day with data (falls back to yesterday if there's no data at all) */
  var y = latestDate_() || yesterdayStr_();
  setView("single");
  document.getElementById("sdFrom").value = y;
  document.getElementById("sdTo").value = y;
  document.getElementById("q").value = "";
  state.captureBad = true;
  renderSingleDay();

  if (!document.querySelector(".single-day-table")) {
    finish();
    alert("No P-attendance users below target for the latest day (" + y + ") ✅ — no image to download.");
    return;
  }
  var fileName = "sf-below-target-P-" + y + ".png";

  window.scrollTo(0, 0);
  var CAP_W = 1100;   /* Image width in px — raise it if the table still gets cut */

  html2canvas(document.getElementById("capture"), {
    backgroundColor: "#eef1f8",
    scale: window.innerWidth < 700 ? 1.5 : 2,   /* lighter on phones to save memory */
    useCORS: true,
    windowWidth: CAP_W + 100,   /* the clone is laid out at desktop width so every column shows */
    onclone: function (doc) {
      var cap = doc.getElementById("capture");
      cap.style.width = CAP_W + "px";
      cap.style.maxWidth = "none";
      Array.prototype.forEach.call(doc.querySelectorAll(".single-day-wrap, .panel"), function (el) {
        el.style.overflow = "visible";
      });
      Array.prototype.forEach.call(doc.querySelectorAll(".scroll-hint"), function (el) {
        el.style.display = "none";
      });
    }
  }).then(function (canvas) {
    canvas.toBlob(function (blob) {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = fileName;
      a.click();
      URL.revokeObjectURL(a.href);
      finish();
    });
  }).catch(function () {
    finish();
    alert("Failed to create the image. Try again.");
  });
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

/* ===== Events ===== */
/* These tabs filter in the browser — the Submit tab is skipped so we don't wipe numbers not yet saved */
function refresh() {
  if (state.view === "submit") return;
  render();
}

/* Month select (All Users bar / QC bar / Team Hours bar): fills From / To with the 26th → 25th period.
   Delegated, because the select is re-created on every render. Changing the month also resets the
   Team Hours week pick, since the list of available weeks depends on the month. */
document.addEventListener("change", function (e) {
  var el = e.target;
  if (!el || !el.classList || !el.classList.contains("month-sel")) return;
  state.month = el.value;
  applyMonthToInputs_();
  state.thWeek = "";
  refresh();
});

/* Team Hours tab: choosing a QC shows only that team's members */
document.addEventListener("change", function (e) {
  var el = e.target;
  if (!el || !el.classList || !el.classList.contains("th-sel")) return;
  state.thTeam = el.value;
  render();
});

/* Team Hours tab: choosing a week shows that week's daily columns */
document.addEventListener("change", function (e) {
  var el = e.target;
  if (!el || !el.classList || !el.classList.contains("th-week-sel")) return;
  state.thWeek = el.value;
  render();
});

/* Manual date edits: the month select switches to the matching month or "Custom range" */
["from", "to"].forEach(function (id) {
  document.getElementById(id).addEventListener("change", function () {
    syncMonthFromInputs_();
    state.thWeek = "";
    refresh();
  });
});

/* Single Day tab: empty fields = today automatically (or the latest day with data), and picking a date changes the data.
   One date only = that day, both = a period. */
["sdFrom", "sdTo"].forEach(function (id) {
  document.getElementById(id).addEventListener("change", function () { renderSingleDay(); });
});

document.getElementById("onlyBad").addEventListener("change", refresh);
document.getElementById("q").addEventListener("input", refresh);

document.getElementById("reset").onclick = function () {
  document.getElementById("from").value = "";
  document.getElementById("to").value = "";
  document.getElementById("q").value = "";
  document.getElementById("onlyBad").checked = false;
  document.getElementById("sdFrom").value = "";
  document.getElementById("sdTo").value = "";
  state.month = defaultMonth_();
  applyMonthToInputs_();
  state.thWeek = "";
  state.sdOpen = {};
  state.open = {};
  state.submitFrom = null; state.submitTo = null; state.submitSavedNote = "";
  load();
};

document.getElementById("tab-users").onclick = function () { setView("users"); };
document.getElementById("tab-single").onclick = function () { setView("single"); };
document.getElementById("tab-teams").onclick = function () { setView("teams"); };
document.getElementById("tab-submit").onclick = function () { setView("submit"); };
document.getElementById("tab-hours").onclick = function () { setView("hours"); };
function setView(v) {
  state.view = v;
  if (!state.capturing) {
    document.getElementById("img").textContent = (v === "hours") ? "Download Table Image" : "Download Image";
  }
  ["users", "single", "teams", "submit", "hours"].forEach(function (id) {
    document.getElementById("tab-" + id).setAttribute("aria-selected", v === id);
  });
  var single = (v === "single");
  document.getElementById("fFrom").style.display = single ? "none" : "flex";
  document.getElementById("fTo").style.display = single ? "none" : "flex";
  document.getElementById("fSdFrom").style.display = single ? "flex" : "none";
  document.getElementById("fSdTo").style.display = single ? "flex" : "none";
  render();
}

/* Details modal: its own month select and the "Below target" box */
document.getElementById("modalBody").addEventListener("change", function (e) {
  var el = e.target;
  if (!modalState || !el) return;
  if (el.id === "mMonth") { setModalMonth_(el.value); }
  else if (el.id === "mBelow") { modalState.below = el.checked; renderModal_(); }
});

document.getElementById("modalClose").onclick = closeDetailsModal_;
document.getElementById("modal").addEventListener("click", function (e) {
  if (e.target === this) closeDetailsModal_();     /* Clicking the backdrop closes it */
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && !document.getElementById("modal").hidden) closeDetailsModal_();
});

document.getElementById("reload").onclick = function () { load(); };
document.getElementById("img").onclick = downloadImage;

/* Quiet auto-refresh (skips the Submit tab, and skips while an image is being prepared) */
setInterval(function () {
  if (document.hidden || state.view === "submit" || state.capturing) return;
  load(true);
}, AUTO_REFRESH_MS);

/* ===== Run ===== */
document.getElementById("from").min = DEFAULT_FROM;
state.month = defaultMonth_();
applyMonthToInputs_();     /* "all" keeps the date fields empty (= all data); "current" fills the current 26th → 25th period */
load();
</script>
</body>
</html>
