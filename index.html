<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الأكتيف تايم — رومات SF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --shell:#e6eaee;
    --surface:#ffffff;
    --line:#ccd5dd;
    --ink:#161d26;
    --muted:#5e6b7a;
    --steel:#1d4e6b;
    --alarm:#a52019;
    --alarm-bg:#fbe7e5;
    --good:#2c6e49;
    --good-bg:#e4f0e8;
    --radius:4px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--shell);
    color:var(--ink);
    font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:14px;
    line-height:1.55;
    font-variant-numeric:tabular-nums;
  }
  .wrap{max-width:1280px;margin:0 auto;padding:20px 16px 64px}

  /* ---------- header ---------- */
  header{
    display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;
    justify-content:space-between;
    padding-bottom:14px;border-bottom:2px solid var(--ink);
  }
  h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.2px}
  h1 small{display:block;font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0}
  .head-actions{display:flex;gap:8px;align-items:center}

  button{
    font-family:inherit;font-size:13px;font-weight:500;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    padding:7px 14px;border-radius:var(--radius);cursor:pointer;
  }
  button:hover{border-color:var(--steel);color:var(--steel)}
  button:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
  button.primary{background:var(--steel);border-color:var(--steel);color:#fff}
  button.primary:hover{background:#17405a;color:#fff}
  button[disabled]{opacity:.5;cursor:default}

  /* ---------- stats ---------- */
  .stats{
    display:flex;flex-wrap:wrap;background:var(--surface);
    border:1px solid var(--line);border-top:none;
  }
  .stat{flex:1 1 150px;padding:14px 18px;border-inline-start:1px solid var(--line)}
  .stat:first-child{border-inline-start:none}
  .stat b{display:block;font-size:26px;font-weight:600;line-height:1.2}
  .stat span{font-size:12px;color:var(--muted)}
  .stat.bad b{color:var(--alarm)}

  /* ---------- filters ---------- */
  .filters{
    display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;
    padding:14px 0;
  }
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:12px;color:var(--muted)}
  input,select{
    font-family:inherit;font-size:13px;color:var(--ink);
    border:1px solid var(--line);background:var(--surface);
    padding:7px 10px;border-radius:var(--radius);min-width:150px;
  }
  input:focus,select:focus{outline:2px solid var(--steel);outline-offset:-1px;border-color:var(--steel)}
  .check{display:flex;align-items:center;gap:6px;font-size:13px;padding-bottom:7px;cursor:pointer}
  .check input{min-width:auto;width:16px;height:16px;accent-color:var(--alarm)}

  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:2px;margin-top:4px}
  .tab{
    border:1px solid var(--line);border-bottom:none;background:#dde3e9;
    padding:9px 18px;font-size:13px;font-weight:500;cursor:pointer;
    border-radius:var(--radius) var(--radius) 0 0;color:var(--muted);
  }
  .tab[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600}

  /* ---------- table ---------- */
  .panel{background:var(--surface);border:1px solid var(--line);overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 12px;text-align:right;border-bottom:1px solid #e8edf1;white-space:nowrap}
  thead th{
    position:sticky;top:0;background:#f1f4f7;font-weight:600;font-size:12px;
    color:var(--muted);cursor:pointer;user-select:none;border-bottom:1px solid var(--line);
  }
  thead th:hover{color:var(--steel)}
  thead th[data-dir]::after{content:attr(data-dir);margin-inline-start:5px;color:var(--steel)}
  tbody tr:hover{background:#f7f9fb}
  td.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;direction:ltr;text-align:right}
  td.hours{font-weight:600;text-align:center}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
  .pill.bad{background:var(--alarm-bg);color:var(--alarm)}
  .pill.ok{background:var(--good-bg);color:var(--good)}
  tr.bad td.hours{background:var(--alarm-bg);color:var(--alarm)}
  tr.ok td.hours{color:var(--good)}
  .dates{white-space:normal;color:var(--muted);font-size:12.5px;line-height:1.9;direction:ltr;text-align:right}
  .dates i{
    font-style:normal;background:var(--alarm-bg);color:var(--alarm);
    padding:1px 7px;border-radius:3px;margin-inline-start:5px;display:inline-block;
  }
  .bar{height:5px;background:#e8edf1;border-radius:3px;overflow:hidden;min-width:70px}
  .bar b{display:block;height:100%;background:var(--alarm)}

  .note{padding:40px 20px;text-align:center;color:var(--muted)}
  .note.error{color:var(--alarm)}
  .foot{margin-top:10px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

  @media (max-width:640px){
    .stat{flex:1 1 50%}
    h1{font-size:19px}
    input,select{min-width:130px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>الأكتيف تايم — رومات SF
      <small id="sub">جاري التحميل…</small>
    </h1>
    <div class="head-actions">
      <button id="csv">تنزيل CSV</button>
      <button id="reload" class="primary">تحديث الداتا</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="filters">
    <div class="field">
      <label for="from">من تاريخ</label>
      <input type="date" id="from">
    </div>
    <div class="field">
      <label for="to">لغاية تاريخ</label>
      <input type="date" id="to">
    </div>
    <div class="field">
      <label for="room">الروم</label>
      <select id="room"><option value="">كل رومات SF</option></select>
    </div>
    <div class="field">
      <label for="q">دور على يوزر</label>
      <input type="search" id="q" placeholder="me123456@meti.ai">
    </div>
    <label class="check"><input type="checkbox" id="onlyBad"> تحت التارجت بس</label>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-daily" aria-selected="true">يوم بيوم</button>
    <button class="tab" role="tab" id="tab-users" aria-selected="false">الأيام الناقصة لكل يوزر</button>
  </div>

  <div class="panel">
    <div id="out"><div class="note">جاري تحميل الداتا من جوجل شيت…</div></div>
  </div>

  <div class="foot">
    <span id="count"></span>
    <span id="stamp"></span>
  </div>

</div>

<script>
/* ===== إعدادات ===== */
var API = "https://script.google.com/macros/s/AKfycbzoZuqCeMHQd37WmloJU98nvzIE-6Rb8TIBdJRd5k8ND72rNeka-8Wu9DXn5NSgzqYaXA/exec";

var state = { rows: [], target: 5.5, view: "daily", sort: { key: "date", dir: -1 } };

/* ===== JSONP (لازم كده عشان GitHub Pages يقدر يكلم Apps Script) ===== */
function jsonp(url, cb, onErr) {
  var name = "cb_" + Date.now() + Math.floor(Math.random() * 1e6);
  var s = document.createElement("script");
  var done = false;
  var timer = setTimeout(function () {
    if (!done) { cleanup(); onErr("الطلب أخد وقت طويل. اتأكد إن الـ deployment شغال ومتاح لأي حد."); }
  }, 30000);

  window[name] = function (data) { done = true; clearTimeout(timer); cleanup(); cb(data); };
  function cleanup() { try { delete window[name]; } catch (e) { window[name] = undefined; } s.remove(); }

  s.src = url + (url.indexOf("?") === -1 ? "?" : "&") + "callback=" + name + "&_=" + Date.now();
  s.onerror = function () { if (!done) { clearTimeout(timer); cleanup(); onErr("مش قادر يوصل للويب آب. راجع اللينك وصلاحيات الـ deployment."); } };
  document.body.appendChild(s);
}

/* ===== تحميل ===== */
function load() {
  var btn = document.getElementById("reload");
  btn.disabled = true; btn.textContent = "بيحمّل…";
  document.getElementById("out").innerHTML = '<div class="note">جاري تحميل الداتا…</div>';

  jsonp(API + "?action=data", function (res) {
    btn.disabled = false; btn.textContent = "تحديث الداتا";
    if (!res || !res.ok) return fail((res && res.error) || "الويب آب رجّع رد مش مفهوم.");

    state.rows = res.rows || [];
    state.target = res.target || 5.5;

    var rooms = (res.meta && res.meta.rooms) || [];
    var sel = document.getElementById("room");
    sel.innerHTML = '<option value="">كل رومات SF</option>' +
      rooms.map(function (r) { return '<option>' + esc(r) + '</option>'; }).join("");

    document.getElementById("sub").textContent =
      "التارجت " + state.target + " ساعة · " + (res.meta ? res.meta.minDate + " ← " + res.meta.maxDate : "");
    document.getElementById("stamp").textContent =
      "آخر تحديث: " + new Date(res.generatedAt).toLocaleString("ar-EG");

    render();
  }, fail);

  function fail(msg) {
    btn.disabled = false; btn.textContent = "تحديث الداتا";
    document.getElementById("out").innerHTML =
      '<div class="note error">' + esc(msg) + '</div>';
  }
}

/* ===== فلترة ===== */
function filtered() {
  var from = document.getElementById("from").value;
  var to = document.getElementById("to").value;
  var room = document.getElementById("room").value;
  var q = document.getElementById("q").value.trim().toLowerCase();
  var bad = document.getElementById("onlyBad").checked;

  return state.rows.filter(function (r) {
    if (from && r.date < from) return false;
    if (to && r.date > to) return false;
    if (room && r.room !== room) return false;
    if (q && r.user.toLowerCase().indexOf(q) === -1) return false;
    if (bad && r.hours >= state.target) return false;
    return true;
  });
}

function groupUsers(rows) {
  var m = {};
  rows.forEach(function (r) {
    var u = m[r.user] || (m[r.user] = { user: r.user, rooms: {}, total: 0, sum: 0, missed: [] });
    u.rooms[r.room] = 1; u.total++; u.sum += r.hours;
    if (r.hours < state.target) u.missed.push(r);
  });
  return Object.keys(m).map(function (k) { return m[k]; });
}

/* ===== رسم ===== */
function render() {
  var rows = filtered();
  renderStats(rows);
  if (state.view === "daily") renderDaily(rows); else renderUsers(rows);
}

function renderStats(rows) {
  var users = {}, bad = 0, sum = 0;
  rows.forEach(function (r) { users[r.user] = 1; sum += r.hours; if (r.hours < state.target) bad++; });
  var n = rows.length;
  var badUsers = {};
  rows.forEach(function (r) { if (r.hours < state.target) badUsers[r.user] = 1; });

  document.getElementById("stats").innerHTML =
    stat(Object.keys(users).length, "يوزر") +
    stat(n, "سجل") +
    stat(bad, "يوم تحت التارجت", true) +
    stat(Object.keys(badUsers).length, "يوزر عنده يوم ناقص", true) +
    stat(n ? (sum / n).toFixed(2) : "0.00", "متوسط الساعات");
}
function stat(v, label, bad) {
  return '<div class="stat' + (bad ? ' bad' : '') + '"><b>' + v + '</b><span>' + label + '</span></div>';
}

function sortRows(rows) {
  var k = state.sort.key, d = state.sort.dir;
  return rows.slice().sort(function (a, b) {
    var x = a[k], y = b[k];
    if (typeof x === "number" && typeof y === "number") return (x - y) * d;
    x = String(x || ""); y = String(y || "");
    return x < y ? -d : (x > y ? d : 0);
  });
}

function renderDaily(rows) {
  document.getElementById("count").textContent = rows.length + " سجل معروض";
  if (!rows.length) return empty();

  var cols = [
    { k: "user", t: "اليوزر" }, { k: "date", t: "التاريخ" }, { k: "room", t: "الروم" },
    { k: "shift", t: "الشيفت" }, { k: "pc", t: "الجهاز" }, { k: "att", t: "الحضور" },
    { k: "hours", t: "الساعات" }, { k: "status", t: "الحالة" }
  ];

  var html = '<table><thead><tr>' + cols.map(function (c) {
    var dir = state.sort.key === c.k ? (state.sort.dir === 1 ? ' data-dir="↑"' : ' data-dir="↓"') : "";
    return '<th data-k="' + c.k + '"' + dir + '>' + c.t + '</th>';
  }).join("") + '</tr></thead><tbody>';

  sortRows(rows).forEach(function (r) {
    var bad = r.hours < state.target;
    html += '<tr class="' + (bad ? "bad" : "ok") + '">' +
      '<td class="mono">' + esc(r.user) + '</td>' +
      '<td class="mono">' + esc(r.date) + '</td>' +
      '<td>' + esc(r.room) + '</td>' +
      '<td>' + esc(r.shift) + '</td>' +
      '<td class="mono">' + esc(r.pc) + '</td>' +
      '<td>' + esc(r.att || "—") + '</td>' +
      '<td class="hours">' + r.hours.toFixed(2) + '</td>' +
      '<td><span class="pill ' + (bad ? "bad" : "ok") + '">' + (bad ? "تحت التارجت" : "محقق") + '</span></td>' +
      '</tr>';
  });

  document.getElementById("out").innerHTML = html + "</tbody></table>";
  bindSort();
}

function renderUsers(rows) {
  var list = groupUsers(rows).filter(function (u) { return u.missed.length; })
    .sort(function (a, b) { return b.missed.length - a.missed.length; });

  document.getElementById("count").textContent = list.length + " يوزر عنده أيام ناقصة";
  if (!list.length) {
    document.getElementById("out").innerHTML =
      '<div class="note">مفيش أي يوزر تحت التارجت في النطاق ده.</div>';
    return;
  }

  var html = '<table><thead><tr>' +
    '<th>اليوزر</th><th>الروم</th><th>أيام ناقصة</th><th>إجمالي الأيام</th>' +
    '<th>نسبة النقص</th><th>متوسط الساعات</th><th>التواريخ الناقصة</th>' +
    '</tr></thead><tbody>';

  list.forEach(function (u) {
    var pct = Math.round(u.missed.length / u.total * 100);
    u.missed.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    html += '<tr>' +
      '<td class="mono">' + esc(u.user) + '</td>' +
      '<td>' + esc(Object.keys(u.rooms).join("، ")) + '</td>' +
      '<td class="hours" style="background:var(--alarm-bg);color:var(--alarm)">' + u.missed.length + '</td>' +
      '<td style="text-align:center">' + u.total + '</td>' +
      '<td><div class="bar"><b style="width:' + pct + '%"></b></div>' +
        '<span style="font-size:12px;color:var(--muted)">' + pct + '%</span></td>' +
      '<td style="text-align:center">' + (u.sum / u.total).toFixed(2) + '</td>' +
      '<td class="dates">' + u.missed.map(function (m) {
        return '<i>' + m.date + " · " + m.hours.toFixed(2) + '</i>';
      }).join("") + '</td>' +
      '</tr>';
  });

  document.getElementById("out").innerHTML = html + "</tbody></table>";
}

function empty() {
  document.getElementById("out").innerHTML =
    '<div class="note">مفيش نتايج بالفلاتر دي. جرب توسّع نطاق التاريخ أو تمسح البحث.</div>';
}

function bindSort() {
  Array.prototype.forEach.call(document.querySelectorAll("th[data-k]"), function (th) {
    th.onclick = function () {
      var k = th.getAttribute("data-k");
      if (k === "status") k = "hours";
      state.sort = { key: k, dir: state.sort.key === k ? -state.sort.dir : 1 };
      render();
    };
  });
}

/* ===== CSV ===== */
function downloadCSV() {
  var rows = filtered(), lines, name;
  if (state.view === "daily") {
    name = "sf-active-time";
    lines = [["User", "Date", "Room", "Shift", "PC", "Attendance", "Hours", "Status"]];
    sortRows(rows).forEach(function (r) {
      lines.push([r.user, r.date, r.room, r.shift, r.pc, r.att,
        r.hours.toFixed(2), r.hours < state.target ? "Below" : "OK"]);
    });
  } else {
    name = "sf-missed-days";
    lines = [["User", "Rooms", "Missed Days", "Total Days", "Miss %", "Avg Hours", "Missed Dates"]];
    groupUsers(rows).filter(function (u) { return u.missed.length; })
      .sort(function (a, b) { return b.missed.length - a.missed.length; })
      .forEach(function (u) {
        lines.push([u.user, Object.keys(u.rooms).join(" / "), u.missed.length, u.total,
          Math.round(u.missed.length / u.total * 100) + "%", (u.sum / u.total).toFixed(2),
          u.missed.map(function (m) { return m.date + " (" + m.hours.toFixed(2) + ")"; }).join(" | ")]);
      });
  }

  var csv = "\uFEFF" + lines.map(function (r) {
    return r.map(function (c) { return '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"'; }).join(",");
  }).join("\r\n");

  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = name + "-" + new Date().toISOString().slice(0, 10) + ".csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

/* ===== ربط الأحداث ===== */
["from", "to", "room", "q", "onlyBad"].forEach(function (id) {
  var el = document.getElementById(id);
  el.addEventListener(el.tagName === "INPUT" && el.type === "search" ? "input" : "change", render);
});
document.getElementById("tab-daily").onclick = function () { setView("daily", this); };
document.getElementById("tab-users").onclick = function () { setView("users", this); };
function setView(v, btn) {
  state.view = v;
  document.getElementById("tab-daily").setAttribute("aria-selected", v === "daily");
  document.getElementById("tab-users").setAttribute("aria-selected", v === "users");
  render();
}
document.getElementById("reload").onclick = load;
document.getElementById("csv").onclick = downloadCSV;

load();
</script>
</body>
</html>
