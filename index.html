<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SF Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#eef1f5;
    --surface:#ffffff;
    --line:#d7dde4;
    --ink:#152033;
    --muted:#647089;
    --accent:#265d8f;
    --accent-ink:#1b4569;
    --glow:rgba(38,93,143,.30);
    --bad:#b3261e;
    --bad-bg:#fbe9e7;
    --good:#1c6e4a;
    --good-bg:#e6f4ec;
    --radius:6px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:14px;line-height:1.55;font-variant-numeric:tabular-nums;
  }
  .wrap{max-width:1340px;margin:0 auto;padding:22px 18px 64px}

  header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;
    justify-content:space-between;padding:16px 20px;margin-bottom:16px;
    background:linear-gradient(135deg,var(--accent-ink),var(--accent));
    border-radius:var(--radius);color:#fff;box-shadow:0 6px 20px rgba(27,69,105,.25)}
  h1{font-size:21px;font-weight:700;margin:0;letter-spacing:-.2px}
  h1 small{display:block;font-size:12.5px;font-weight:400;color:#cfe0ef;margin-top:3px}
  .head-actions{display:flex;gap:8px;align-items:center}

  button{font-family:inherit;font-size:13px;font-weight:500;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    padding:8px 16px;border-radius:var(--radius);cursor:pointer;
    transition:box-shadow .15s ease,transform .15s ease,border-color .15s ease}
  button:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow),0 6px 16px rgba(38,93,143,.18);transform:translateY(-1px)}
  button:focus-visible{outline:2px solid #fff;outline-offset:2px}
  button.primary{background:#ffffff;border-color:#ffffff;color:var(--accent-ink);font-weight:600}
  button.primary:hover{box-shadow:0 0 0 3px rgba(255,255,255,.4),0 6px 16px rgba(0,0,0,.15)}
  button.ghost{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
  button.ghost:hover{box-shadow:0 0 0 3px rgba(255,255,255,.25)}
  button[disabled]{opacity:.5;cursor:default;transform:none;box-shadow:none}

  .stats{display:flex;flex-wrap:wrap;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
  .stat{flex:1 1 150px;padding:16px 18px;border-inline-start:1px solid var(--line);
    transition:box-shadow .15s ease,background .15s ease;cursor:default}
  .stat:first-child{border-inline-start:none}
  .stat:hover{box-shadow:inset 0 0 0 2px var(--glow);background:#f6f9fc;z-index:1;position:relative}
  .stat b{display:block;font-size:27px;font-weight:700;line-height:1.2}
  .stat span{font-size:12px;color:var(--muted)}
  .stat.bad b{color:var(--bad)}

  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;
    padding:14px 16px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);margin-bottom:12px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:12px;color:var(--muted)}
  input,select{font-family:inherit;font-size:13px;color:var(--ink);
    border:1px solid var(--line);background:var(--surface);
    padding:8px 10px;border-radius:var(--radius);min-width:165px;
    transition:box-shadow .15s ease,border-color .15s ease}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
  .check{display:flex;align-items:center;gap:6px;font-size:13px;padding-bottom:8px;cursor:pointer}
  .check input{min-width:auto;width:16px;height:16px;accent-color:var(--bad)}

  .tabs{display:flex;gap:6px;margin-bottom:0}
  .tab{border:1px solid var(--line);background:var(--surface);
    padding:10px 20px;font-size:13px;font-weight:500;cursor:pointer;
    border-radius:var(--radius) var(--radius) 0 0;color:var(--muted);
    border-bottom:none;position:relative;top:1px;
    transition:box-shadow .15s ease,color .15s ease}
  .tab:hover{color:var(--accent-ink);box-shadow:0 -3px 0 0 var(--glow) inset}
  .tab[aria-selected="true"]{background:var(--surface);color:var(--accent-ink);
    font-weight:700;border-color:var(--accent);box-shadow:0 -3px 0 0 var(--accent) inset}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:0 var(--radius) var(--radius) var(--radius);overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 13px;text-align:right;border-bottom:1px solid #eef1f5;white-space:nowrap}
  thead th{position:sticky;top:0;background:#f4f6f9;font-weight:600;font-size:12px;
    color:var(--muted);cursor:pointer;user-select:none;border-bottom:1px solid var(--line);z-index:2;
    transition:color .15s ease,background .15s ease}
  thead th:hover{color:var(--accent-ink);background:#eaf0f6}
  thead th[data-dir]::after{content:attr(data-dir);margin-inline-start:5px;color:var(--accent)}
  tbody tr{transition:box-shadow .12s ease,background .12s ease}
  tbody tr:hover td{background:#f5f9fc;box-shadow:inset 0 1px 0 var(--accent),inset 0 -1px 0 var(--accent)}
  td.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;direction:ltr;text-align:right}
  td.num{text-align:center}
  td.hours{font-weight:700;text-align:center}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .pill.bad{background:var(--bad-bg);color:var(--bad)}
  .pill.ok{background:var(--good-bg);color:var(--good)}
  tr.bad td.hours{background:var(--bad-bg);color:var(--bad)}
  tr.ok td.hours{color:var(--good)}
  .miss{font-weight:700;text-align:center;background:var(--bad-bg);color:var(--bad)}
  .miss.zero{background:var(--good-bg);color:var(--good)}
  .bar{height:6px;background:#e8edf3;border-radius:3px;overflow:hidden;min-width:80px}
  .bar b{display:block;height:100%;background:var(--bad)}
  .bar.ok b{background:var(--good)}
  .toggle{border:none;background:none;color:var(--accent);padding:2px 6px;font-size:12.5px;
    cursor:pointer;text-decoration:underline;border-radius:4px;transition:box-shadow .12s ease}
  .toggle:hover{box-shadow:0 0 0 3px var(--glow)}
  tr.detail td{background:#f5f9fc;white-space:normal;padding:10px 16px}
  .dates{direction:ltr;text-align:right;line-height:2}
  .dates i{font-style:normal;background:var(--bad-bg);color:var(--bad);
    padding:2px 8px;border-radius:3px;margin-inline-start:6px;display:inline-block;font-size:12.5px}
  .name{font-weight:600}
  .name.empty{color:var(--muted);font-weight:400}

  .note{padding:44px 20px;text-align:center;color:var(--muted)}
  .note.error{color:var(--bad)}
  .note a{color:var(--accent)}
  .note code{background:#eef2f5;padding:2px 6px;border-radius:3px;direction:ltr;display:inline-block}
  .foot{margin-top:10px;font-size:12px;color:var(--muted);display:flex;
    justify-content:space-between;flex-wrap:wrap;gap:8px}

  .teamcard{display:flex;flex-wrap:wrap;gap:14px;padding:16px}
  .tcard{flex:1 1 260px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:16px;transition:box-shadow .15s ease,transform .15s ease}
  .tcard:hover{box-shadow:0 0 0 2px var(--glow),0 10px 24px rgba(38,93,143,.14);transform:translateY(-2px)}
  .tcard h3{margin:0 0 10px;font-size:15px;font-weight:700}
  .tcard .big{font-size:28px;font-weight:700;color:var(--accent-ink)}
  .tcard .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
  .tcard .row b{color:var(--ink);font-weight:600}

  @media (max-width:640px){
    .stat{flex:1 1 50%}
    h1{font-size:18px}
    input,select{min-width:135px}
    header{padding:14px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>SF Dashboard
      <small id="sub">جاري التحميل…</small>
    </h1>
    <div class="head-actions">
      <button id="img" class="ghost">تنزيل صورة</button>
      <button id="reload" class="primary">تحديث الداتا</button>
    </div>
  </header>

  <div id="capture">
    <div class="stats" id="stats"></div>

    <div class="filters">
      <div class="field">
        <label for="q">دور على يوزر (اكتب الأرقام بس)</label>
        <input type="search" id="q" list="userlist" placeholder="123456" autocomplete="off">
        <datalist id="userlist"></datalist>
      </div>
      <div class="field">
        <label for="from">من تاريخ</label>
        <input type="date" id="from">
      </div>
      <div class="field">
        <label for="to">لغاية تاريخ</label>
        <input type="date" id="to">
      </div>
      <div class="field">
        <label for="room">الروم</label>
        <select id="room"><option value="">كل رومات SF</option></select>
      </div>
      <label class="check"><input type="checkbox" id="onlyBad"> تحت التارجت بس</label>
      <button id="reset">مسح الفلاتر</button>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-users" aria-selected="true">كل اليوزرات</button>
      <button class="tab" role="tab" id="tab-daily" aria-selected="false">يوم بيوم</button>
      <button class="tab" role="tab" id="tab-teams" aria-selected="false">متوسط الفرق (QC)</button>
    </div>

    <div class="panel">
      <div id="out"><div class="note">جاري تحميل الداتا من جوجل شيت…</div></div>
    </div>
  </div>

  <div class="foot">
    <span id="count"></span>
    <span id="stamp"></span>
  </div>

</div>

<script>
/* ===== إعدادات ===== */
var API = "https://script.google.com/macros/s/AKfycbzoZuqCeMHQd37WmloJU98nvzIE-6Rb8TIBdJRd5k8ND72rNeka-8Wu9DXn5NSgzqYaXA/exec";

var state = {
  rows: [], target: 5.5, view: "users",
  sortDaily: { key: "date", dir: -1 },
  sortUsers: { key: "missed", dir: -1 },
  open: {}, teams: null
};

/* ===== JSONP ===== */
function jsonp(url, cb, onErr) {
  var name = "cb_" + Date.now() + Math.floor(Math.random() * 1e6);
  var s = document.createElement("script");
  var done = false;
  var timer = setTimeout(function () {
    if (!done) { cleanup(); onErr("الطلب أخد وقت طويل. اتأكد إن الـ deployment شغال ومتاح لأي حد."); }
  }, 40000);
  window[name] = function (d) { done = true; clearTimeout(timer); cleanup(); cb(d); };
  function cleanup() { try { delete window[name]; } catch (e) { window[name] = undefined; } s.remove(); }
  s.src = url + (url.indexOf("?") === -1 ? "?" : "&") + "callback=" + name + "&_=" + Date.now();
  s.onerror = function () {
    if (!done) { clearTimeout(timer); cleanup(); onErr("مش قادر يوصل للويب آب. راجع اللينك وصلاحيات الـ deployment."); }
  };
  document.body.appendChild(s);
}

/* ===== تحميل ===== */
function load() {
  var btn = document.getElementById("reload");
  btn.disabled = true; btn.textContent = "بيحمّل…";
  document.getElementById("out").innerHTML = '<div class="note">جاري تحميل الداتا…</div>';

  jsonp(API + "?action=data", function (res) {
    btn.disabled = false; btn.textContent = "تحديث الداتا";
    if (!res || !res.ok) return fail((res && res.error) || "الويب آب رجّع رد مش مفهوم.");

    state.rows = res.rows || [];
    state.target = res.target || 5.5;
    state.teams = null;

    var rooms = (res.meta && res.meta.rooms) || [];
    document.getElementById("room").innerHTML =
      '<option value="">كل رومات SF</option>' +
      rooms.map(function (r) { return '<option>' + esc(r) + '</option>'; }).join("");

    var users = {};
    state.rows.forEach(function (r) { users[r.user] = 1; });
    document.getElementById("userlist").innerHTML =
      Object.keys(users).sort().map(function (u) { return '<option value="' + esc(u) + '">'; }).join("");

    var covTxt = (res.meta && res.meta.namesCoverage != null) ? " · الأسماء متاحة لـ " + res.meta.namesCoverage + "% من السجلات" : "";
    document.getElementById("sub").textContent = state.rows.length
      ? "التارجت " + state.target + " ساعة · " + res.meta.minDate + " ← " + res.meta.maxDate + covTxt
      : "مفيش داتا راجعة من الشيت";
    document.getElementById("stamp").textContent =
      "آخر تحديث: " + new Date(res.generatedAt).toLocaleString("ar-EG");

    if (!state.rows.length) return noData();
    render();
  }, fail);

  function fail(msg) {
    btn.disabled = false; btn.textContent = "تحديث الداتا";
    document.getElementById("out").innerHTML = '<div class="note error">' + esc(msg) + '</div>';
  }
}

function loadTeams(cb) {
  jsonp(API + "?action=teams", function (res) {
    if (!res || !res.ok) { document.getElementById("out").innerHTML =
      '<div class="note error">' + esc((res && res.error) || "تعذر تحميل بيانات الفرق.") + '</div>'; return; }
    state.teams = res.teams || [];
    cb();
  }, function (msg) {
    document.getElementById("out").innerHTML = '<div class="note error">' + esc(msg) + '</div>';
  });
}

function noData() {
  document.getElementById("stats").innerHTML = "";
  document.getElementById("out").innerHTML =
    '<div class="note">الويب آب اشتغل بس رجّع صفر سجلات لرومات SF.<br><br>' +
    'افتح اللينك ده في تاب جديد وشوف الكود شايف إيه في الشيت:<br>' +
    '<a href="' + API + '?action=debug" target="_blank" rel="noopener">فتح صفحة التشخيص</a></div>';
}

/* ===== فلترة ===== */
function digits(s) { return String(s).replace(/\D+/g, ""); }

function matchUser(user, name, q) {
  if (!q) return true;
  var lower = q.toLowerCase();
  if (user.toLowerCase().indexOf(lower) > -1) return true;
  if (name && name.toLowerCase().indexOf(lower) > -1) return true;
  var qd = digits(q);
  if (qd && digits(user).indexOf(qd) > -1) return true;
  return false;
}

function filtered() {
  var from = document.getElementById("from").value;
  var to = document.getElementById("to").value;
  var room = document.getElementById("room").value;
  var q = document.getElementById("q").value.trim();
  var bad = document.getElementById("onlyBad").checked;

  return state.rows.filter(function (r) {
    if (from && r.date < from) return false;
    if (to && r.date > to) return false;
    if (room && r.room !== room) return false;
    if (!matchUser(r.user, r.name, q)) return false;
    if (bad && r.hours >= state.target) return false;
    return true;
  });
}

function groupUsers(rows) {
  var m = {};
  rows.forEach(function (r) {
    var u = m[r.user] || (m[r.user] = { user: r.user, name: r.name, rooms: {}, total: 0, sum: 0, missed: [] });
    u.rooms[r.room] = 1; u.total++; u.sum += r.hours;
    if (r.hours < state.target) u.missed.push(r);
  });
  return Object.keys(m).map(function (k) {
    var u = m[k];
    u.avg = u.total ? u.sum / u.total : 0;
    u.pct = u.total ? u.missed.length / u.total : 0;
    u.roomText = Object.keys(u.rooms).join("، ");
    u.missedCount = u.missed.length;
    u.missed.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    return u;
  });
}

/* ===== رسم ===== */
function render() {
  if (!state.rows.length) return noData();
  if (state.view === "teams") { renderTeamsTab(); return; }
  var rows = filtered();
  renderStats(rows);
  if (state.view === "users") renderUsers(rows); else renderDaily(rows);
}

function renderStats(rows) {
  var users = {}, badUsers = {}, bad = 0, sum = 0;
  rows.forEach(function (r) {
    users[r.user] = 1; sum += r.hours;
    if (r.hours < state.target) { bad++; badUsers[r.user] = 1; }
  });
  document.getElementById("stats").innerHTML =
    stat(Object.keys(users).length, "يوزر") +
    stat(rows.length, "سجل") +
    stat(bad, "يوم تحت التارجت", true) +
    stat(Object.keys(badUsers).length, "يوزر عنده يوم ناقص", true) +
    stat(rows.length ? (sum / rows.length).toFixed(2) : "0.00", "متوسط الساعات");
}
function stat(v, label, bad) {
  return '<div class="stat' + (bad ? ' bad' : '') + '"><b>' + v + '</b><span>' + label + '</span></div>';
}

function sortBy(arr, s) {
  return arr.slice().sort(function (a, b) {
    var x = a[s.key], y = b[s.key];
    if (typeof x === "number" && typeof y === "number") return (x - y) * s.dir;
    x = String(x || ""); y = String(y || "");
    return x < y ? -s.dir : (x > y ? s.dir : 0);
  });
}

function th(cols, s) {
  return '<thead><tr>' + cols.map(function (c) {
    var dir = s.key === c.k ? (s.dir === 1 ? ' data-dir="↑"' : ' data-dir="↓"') : "";
    return '<th data-k="' + c.k + '"' + dir + '>' + c.t + '</th>';
  }).join("") + '</tr></thead>';
}

function nameCell(name) {
  return name ? '<span class="name">' + esc(name) + '</span>' : '<span class="name empty">—</span>';
}

/* --- كل اليوزرات --- */
function renderUsers(rows) {
  var list = groupUsers(rows);
  document.getElementById("count").textContent = list.length + " يوزر معروض";
  if (!list.length) return empty();

  var cols = [
    { k: "name", t: "الاسم" }, { k: "user", t: "اليوزر" }, { k: "roomText", t: "الروم" },
    { k: "total", t: "أيام مسجلة" }, { k: "missedCount", t: "أيام ناقصة" },
    { k: "pct", t: "نسبة النقص" }, { k: "avg", t: "متوسط الساعات" },
    { k: "sum", t: "إجمالي الساعات" }, { k: "x", t: "التفاصيل" }
  ];

  var html = '<table>' + th(cols, state.sortUsers) + '<tbody>';

  sortBy(list, state.sortUsers).forEach(function (u) {
    var pct = Math.round(u.pct * 100);
    var open = !!state.open[u.user];
    html += '<tr>' +
      '<td>' + nameCell(u.name) + '</td>' +
      '<td class="mono">' + esc(u.user) + '</td>' +
      '<td>' + esc(u.roomText) + '</td>' +
      '<td class="num">' + u.total + '</td>' +
      '<td class="miss' + (u.missedCount ? '' : ' zero') + '">' + u.missedCount + '</td>' +
      '<td><div class="bar' + (u.missedCount ? '' : ' ok') + '"><b style="width:' + pct + '%"></b></div>' +
        '<span style="font-size:12px;color:var(--muted)">' + pct + '%</span></td>' +
      '<td class="num">' + u.avg.toFixed(2) + '</td>' +
      '<td class="num">' + u.sum.toFixed(2) + '</td>' +
      '<td>' + (u.missedCount
        ? '<button class="toggle" data-u="' + esc(u.user) + '">' + (open ? "إخفاء" : "الأيام الناقصة") + '</button>'
        : '<span style="color:var(--muted)">—</span>') + '</td>' +
      '</tr>';

    if (open && u.missedCount) {
      html += '<tr class="detail"><td colspan="9"><div class="dates">' +
        u.missed.map(function (m) {
          return '<i>' + m.date + " · " + m.hours.toFixed(2) + " ساعة</i>";
        }).join("") + '</div></td></tr>';
    }
  });

  document.getElementById("out").innerHTML = html + '</tbody></table>';
  bindSort(state.sortUsers);
  Array.prototype.forEach.call(document.querySelectorAll(".toggle"), function (b) {
    b.onclick = function () {
      var u = b.getAttribute("data-u");
      state.open[u] = !state.open[u];
      render();
    };
  });
}

/* --- يوم بيوم --- */
function renderDaily(rows) {
  document.getElementById("count").textContent = rows.length + " سجل معروض";
  if (!rows.length) return empty();

  var cols = [
    { k: "name", t: "الاسم" }, { k: "user", t: "اليوزر" }, { k: "date", t: "التاريخ" }, { k: "room", t: "الروم" },
    { k: "shift", t: "الشيفت" }, { k: "pc", t: "الجهاز" }, { k: "att", t: "الحضور" },
    { k: "hours", t: "الساعات" }, { k: "hours", t: "الحالة" }
  ];

  var html = '<table>' + th(cols, state.sortDaily) + '<tbody>';
  sortBy(rows, state.sortDaily).forEach(function (r) {
    var bad = r.hours < state.target;
    html += '<tr class="' + (bad ? "bad" : "ok") + '">' +
      '<td>' + nameCell(r.name) + '</td>' +
      '<td class="mono">' + esc(r.user) + '</td>' +
      '<td class="mono">' + esc(r.date) + '</td>' +
      '<td>' + esc(r.room) + '</td>' +
      '<td>' + esc(r.shift) + '</td>' +
      '<td class="mono">' + esc(r.pc) + '</td>' +
      '<td>' + esc(r.att || "—") + '</td>' +
      '<td class="hours">' + r.hours.toFixed(2) + '</td>' +
      '<td><span class="pill ' + (bad ? "bad" : "ok") + '">' + (bad ? "تحت التارجت" : "محقق") + '</span></td>' +
      '</tr>';
  });

  document.getElementById("out").innerHTML = html + '</tbody></table>';
  bindSort(state.sortDaily);
}

/* --- متوسط الفرق (QC) --- */
function renderTeamsTab() {
  document.getElementById("stats").innerHTML = "";
  if (state.teams === null) {
    document.getElementById("out").innerHTML = '<div class="note">جاري تحميل بيانات الفرق…</div>';
    loadTeams(renderTeamsTab);
    return;
  }
  var teams = state.teams;
  document.getElementById("count").textContent = teams.length + " فريق";
  if (!teams.length) {
    document.getElementById("out").innerHTML = '<div class="note">مفيش بيانات Team Lead / QC في السجلات الحالية.</div>';
    return;
  }

  var html = '<div class="teamcard">';
  teams.forEach(function (t) {
    var pct = Math.round(t.belowPct * 100);
    html += '<div class="tcard">' +
      '<h3>' + esc(t.tl) + '</h3>' +
      '<div class="big">' + t.avgHours.toFixed(2) + '<span style="font-size:13px;color:var(--muted);font-weight:400"> ساعة/يوم</span></div>' +
      '<div class="row"><span>عدد الأفراد</span><b>' + t.members + '</b></div>' +
      '<div class="row"><span>إجمالي السجلات</span><b>' + t.records + '</b></div>' +
      '<div class="row"><span>إجمالي الساعات</span><b>' + t.totalHours.toFixed(1) + '</b></div>' +
      '<div class="row"><span>أيام تحت التارجت</span><b style="color:' + (t.below ? 'var(--bad)' : 'var(--good)') + '">' + t.below + ' (' + pct + '%)</b></div>' +
      '</div>';
  });
  html += '</div>';
  document.getElementById("out").innerHTML = html;
}

function empty() {
  document.getElementById("out").innerHTML =
    '<div class="note">مفيش نتايج بالفلاتر دي. امسح الفلاتر أو وسّع نطاق التاريخ.</div>';
}

function bindSort(s) {
  Array.prototype.forEach.call(document.querySelectorAll("th[data-k]"), function (el) {
    el.onclick = function () {
      var k = el.getAttribute("data-k");
      if (k === "x") return;
      if (s.key === k) s.dir = -s.dir; else { s.key = k; s.dir = 1; }
      render();
    };
  });
}

/* ===== تنزيل صورة ===== */
function downloadImage() {
  var btn = document.getElementById("img");
  btn.disabled = true; btn.textContent = "بيجهّز الصورة…";

  html2canvas(document.getElementById("capture"), {
    backgroundColor: "#eef1f5",
    scale: 2,
    useCORS: true
  }).then(function (canvas) {
    canvas.toBlob(function (blob) {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "sf-dashboard-" + new Date().toISOString().slice(0, 10) + ".png";
      a.click();
      URL.revokeObjectURL(a.href);
      btn.disabled = false; btn.textContent = "تنزيل صورة";
    });
  }).catch(function () {
    btn.disabled = false; btn.textContent = "تنزيل صورة";
    alert("تعذر إنشاء الصورة. جرب تاني.");
  });
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

/* ===== الأحداث ===== */
["from", "to", "room", "onlyBad"].forEach(function (id) {
  document.getElementById(id).addEventListener("change", render);
});
document.getElementById("q").addEventListener("input", render);

document.getElementById("reset").onclick = function () {
  ["from", "to", "q"].forEach(function (id) { document.getElementById(id).value = ""; });
  document.getElementById("room").value = "";
  document.getElementById("onlyBad").checked = false;
  state.open = {};
  render();
};

document.getElementById("tab-users").onclick = function () { setView("users"); };
document.getElementById("tab-daily").onclick = function () { setView("daily"); };
document.getElementById("tab-teams").onclick = function () { setView("teams"); };
function setView(v) {
  state.view = v;
  document.getElementById("tab-users").setAttribute("aria-selected", v === "users");
  document.getElementById("tab-daily").setAttribute("aria-selected", v === "daily");
  document.getElementById("tab-teams").setAttribute("aria-selected", v === "teams");
  render();
}

document.getElementById("reload").onclick = load;
document.getElementById("img").onclick = downloadImage;

load();
</script>
</body>
</html>
